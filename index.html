function viewPrivacy() {
  const { memories, bag } = S.data;
  const bytes = memories.reduce((n, m) => n + m.box.ct.byteLength + m.responses.reduce((k, r) => k + r.box.ct.byteLength, 0), 0);
  const sample = memories[0]?.box.ct.subarray(0, 48);
  const hex = sample ? Array.from(sample, (b) => b.toString(16).padStart(2, "0")).join(" ") + " …" : "nothing yet";
  const code = bag.key.match(/.{1,4}/g).join(" ");
  let h = topbar("home");
  h += `<div class="stack"><span class="eyebrow">Settings &amp; privacy</span><h2>You, and what's kept.</h2></div>
    <div class="stack">
      <div><label for="myName">Your name</label><input id="myName" type="text" value="${esc(currentOwner().name)}" autocomplete="given-name"></div>
      <button class="btn" data-action="save-name">Save my name</button>
      <p class="muted small">Your chapter (generation ${currentOwner().gen}) is signed with this name.</p>
    </div>
    <hr class="stitch">
    <div class="stack">
      <h3>Your bag's tag</h3>
      <p class="muted small">${S.data.tagSeenAt ? `Last tapped ${new Date(S.data.tagSeenAt).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" })}.` : "Not set up yet. Write this bag's link onto the tag once, and tapping it opens Keepsake."}</p>
      <button class="btn" data-action="tag-setup">${S.view.tagSetup ? "Hide the steps" : S.data.tagSeenAt ? "Write another tag" : "Set up the tag"}</button>
      ${S.view.tagSetup ? tagSetupBlock(S.data.bag) : ""}
    </div>
    <hr class="stitch">
    <div class="stack">
      <h3>Your bag's buzzer</h3>
      ${bleStatusBlock()}
      ${realBagPaired() ? `<div class="row"><button class="btn" data-action="ble-test" data-cmd="${esc(CONFIG.buzz.open)}">Test the buzz</button><button class="btn" data-action="ble-forget">Forget this bag</button></div>` : ""}
    </div>
    <hr class="stitch">
    <div>
      <div class="kv"><b>In the bag</b><span>On its tag: the bag's ID and its key. Nothing else, and no tracking. Its buzzer only receives buzz commands over Bluetooth; the key never goes to it.</span></div>
      <div class="kv"><b>On this phone</b><span>${memories.length} sealed memor${memories.length === 1 ? "y" : "ies"} (${(bytes / 1024).toFixed(1)} KB), encrypted with AES-256. In this prototype they're stored in this browser only.</span></div>
      <div class="kv"><b>Your location</b><span>Used only while the app is open, to seal a memory to a spot and to check you're back there. It isn't stored or sent anywhere${window.ReactNativeWebView ? ", except to Apple Maps once per memory to suggest the place's name" : ""}.</span></div>
      <div class="kv"><b>In the cloud</b><span>Nothing yet. When sync arrives it will hold only the sealed files, never the key.</span></div>
      <div class="kv"><b>What a sealed memory looks like</b><span class="mono">${hex}</span></div>
      <div class="kv"><b>Recovery code</b><span class="muted small">If the bag's patch is ever lost, this code opens everything. Write it down and keep it somewhere safe.</span><span class="mono" id="recCode">${code}</span>
        <button class="link" data-action="copy-code" style="justify-self:start">Copy the code</button></div>
    </div>
    <button class="btn primary" data-action="export" id="exportBtn">Export everything</button>
    <p class="muted small" id="exportNote">Photos as JPG, recordings as WAV, words as TXT, in one .zip. No special app needed to open them.</p>
    <hr class="stitch">`;
  if (S.view.confirmDelete) {
    h += `<div class="notice bad stack" role="alert"><b>Delete everything on this phone?</b><span>The sealed memories and the key will be erased here. The bag itself keeps its key, but these memories can't come back unless you exported them.</span>
      <div class="row"><button class="btn primary" data-action="delete-yes" style="background:var(--warn);border-color:var(--warn)">Delete everything</button><button class="btn" data-action="delete-no">Keep them</button></div></div>`;
  } else {
    h += `<button class="btn" data-action="replay-intro">See the introduction again</button>
      <p class="muted small" style="text-align:center;margin:0">Your bag and its memories stay as they are.</p>
      <hr class="stitch">`;
    h += `<div class="row"><button class="btn" data-action="new-bag">Start with a new bag</button><button class="btn" data-action="delete">Delete everything</button></div>`;
    h += `<p class="muted small" style="text-align:center">Keepsake web · version ${BUILD.startsWith("__") ? "preview" : BUILD} · with NFC tags and Bluetooth</p>`;
  }
  return h;
}

/* ---------- first launch: who you are, where you are, which bag ---------- */
function viewWelcome() {
  const step = S.view.step || "hello";
  if (step === "hello") return `
    <div class="stack onboard"><span class="eyebrow">Keepsake</span><h1>A bag that remembers.</h1>
      <p>Seal a photo, your voice or a few words to the place where something happened.</p>
      <p>It waits there. Whoever carries this bag later can come back, tap it, and the memory opens.</p>
      <p class="muted">Each person who carries the bag adds a chapter.</p></div>
    <button class="btn primary" data-ob="name">Begin</button>`;
  if (step === "name") return `
    <div class="stack onboard"><span class="eyebrow">1 of 3</span><h2>What's your name?</h2>
      <p class="muted">Your chapter is signed with it. You can change it later in Settings.</p>

    <div class="stack onboard"><span class="eyebrow">2 of 3</span><h2>Memories live in places.</h2>

    <div class="stack onboard"><span class="eyebrow">3 of 3</span><h2>Which bag are you holding${S.ob.name ? `, ${esc(S.ob.name)}` : ""}?</h2></div>

      <button class="choice" data-action="ob-example">${icons.rings}<span><b>Lena's bag</b><span class="muted small">An example bag, passed down to you. Three of her memories wait around Providence.</span></span></button>
      <button class="choice" data-action="ob-new">${icons.bag}<span><b>A new bag</b><span class="muted small">Begin the first chapter yourself.</span></span></button>

function obStep(step) {
  if (S.view.step === "name") {
    const v = $("#obName")?.value.trim() || "";
    if (!v && step !== "name") { toast("Add your name first."); return; }
    S.ob.name = v;
  }
  S.view = { name: "welcome", step };
  render(); window.scrollTo({ top: 0 });
  if (!reduceMotion()) $("#app").animate([{ opacity: 0, transform: "translateY(24px)" }, { opacity: 1, transform: "none" }], { duration: 480, easing: EASE });
  if (step === "name") $("#obName")?.focus();
}
async function finishOnboarding(data) {
  S.data = data; S.opened.clear(); persist();
  S.view = { name: "home" }; render(); bagFace();
  // Now the bag is theirs: it closes, and they open it.
  await Bag.close("Press the clasp to open");
  await Bag.waitForClasp();
  await Bag.open();
}

/* ---------- where they wait: the globe ---------- */
// Memories that sit close together on the ground share one light on the globe.
function placeGroups() {
  const groups = [];
  for (const m of S.data.memories) {
    const g = groups.find((x) => haversine(x, m.place) < 300);
    if (g) g.ids.push(m.id); else groups.push({ lat: m.place.lat, lng: m.place.lng, name: m.place.name, ids: [m.id] });
  }
  return groups;
}
function viewMap() {
  const ms = S.data.memories, groups = placeGroups();
  let h = topbar("home");
  h += `<div class="stack"><span class="eyebrow">Where they wait</span><h2>${ms.length} memor${ms.length === 1 ? "y" : "ies"}, ${groups.length} place${groups.length === 1 ? "" : "s"}.</h2>
    <p class="muted">Turn the globe with your finger. Tap a light to see what waits there.</p></div>
    <div class="globe-wrap"><canvas id="globe" role="img" aria-label="A globe with ${groups.length} lit place${groups.length === 1 ? "" : "s"} where memories are sealed. The same places are listed below."></canvas>
      <div class="globe-zoom"><button data-action="zoom-in" aria-label="Zoom in">+</button><button data-action="zoom-out" aria-label="Zoom out">−</button></div></div>
    <div id="localPanel" aria-live="polite"></div>
    <hr class="stitch"><div class="chapters"><section class="pocket" aria-label="Places"><div class="chapter-head"><h3>Places</h3></div>`;
  groups.forEach((g, i) => {
    const c = here() ? fmtDist(haversine(here(), g)) + " away" : "";
    h += `<button class="mem-btn" data-place="${i}"><i class="dot"></i><span><b>${esc(g.name)}</b><br><span class="muted small">${g.ids.length} memor${g.ids.length === 1 ? "y" : "ies"}</span></span><span class="meta">${c}</span></button>`;
  });
  return h + `</section></div>`;
}

/** A close-up of one area: the memories around it, where you are, and how big each place's circle is. */
function localPanel(center) {
  const near = S.data.memories.filter((m) => haversine(center, m.place) < 25000);
  const me = here();
  const pts = near.map((m) => ({ m, lat: m.place.lat, lng: m.place.lng }));
  const meNear = me && haversine(center, me) < 25000;
  const all = [...pts, ...(meNear ? [{ lat: me.lat, lng: me.lng }] : [])];
  const lat0 = all.reduce((a, p) => a + p.lat, 0) / all.length, lng0 = all.reduce((a, p) => a + p.lng, 0) / all.length;
  const k = Math.cos((lat0 * Math.PI) / 180);
  const xy = (p) => ({ x: (p.lng - lng0) * k * 111320, y: -(p.lat - lat0) * 111320 }); // metres, north up
  const P = all.map(xy);
  const span = Math.max(400, ...P.map((p) => Math.abs(p.x) * 2), ...P.map((p) => Math.abs(p.y) * 2 * 1.35)) * 1.25;
  const W = 320, H = 236, sc = W / span;
  const sx = (p) => W / 2 + xy(p).x * sc, sy = (p) => H / 2 + xy(p).y * sc;
  const nice = [100, 200, 500, 1000, 2000, 5000, 10000].find((d) => d * sc > 50) || 10000;
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Close-up of ${near.length} memor${near.length === 1 ? "y" : "ies"} around ${esc(near[0]?.place.name || "here")}">
    <rect x="4" y="4" width="${W - 8}" height="${H - 8}" rx="14" fill="none" stroke="var(--line)" stroke-dasharray="4 4" opacity=".7"/>
    <text x="${W - 22}" y="26" text-anchor="middle" font-family="Instrument Serif, Georgia, serif" font-size="16" fill="var(--muted)">N</text>
    <path d="M ${W - 22} 32 l 0 14 M ${W - 26} 36 l 4 -4 l 4 4" stroke="var(--muted)" fill="none" stroke-width="1.2"/>
    <path d="M 20 ${H - 22} h ${nice * sc}" stroke="var(--fg)" stroke-width="2"/>
    <text x="20" y="${H - 28}" font-family="DM Sans, sans-serif" font-size="11" fill="var(--muted)">${fmtDist(nice)}</text>`;
  const placed = []; // label boxes already drawn, so labels don't sit on each other
  if (meNear) placed.push({ x: sx(me) - 14, y: sy(me) + 8, w: 28, h: 16 });
  for (const { m } of pts) {
    const x = sx(m.place), y = sy(m.place), r = Math.max(3, m.radius * sc);
    const label = m.place.name.length > 24 ? m.place.name.slice(0, 23) + "…" : m.place.name;
    const lw = label.length * 5.6 + 6;
    const anchor = x < lw / 2 + 10 ? "start" : x > W - lw / 2 - 10 ? "end" : "middle";
    const lx = anchor === "start" ? Math.max(10, x - 6) : anchor === "end" ? Math.min(W - 10, x + 6) : x;
    const left = anchor === "start" ? lx : anchor === "end" ? lx - lw : lx - lw / 2;
    const hitsBox = (ty) => placed.some((b) => left < b.x + b.w && left + lw > b.x && ty - 12 < b.y + b.h && ty > b.y);
    let ly = y - 11;
    if (hitsBox(ly)) ly = y + 21;
    for (let k = 0; hitsBox(ly) && k < 4; k++) ly += 14;
    placed.push({ x: left, y: ly - 12, w: lw, h: 14 });
    const open = placeCheck(m).inside && m.armed !== false;
    svg += `<g class="pin" data-mem="${m.id}" tabindex="0" role="button" aria-label="${esc(m.author)}'s ${kindWord[m.kind]} at ${esc(m.place.name)}">
      <circle cx="${x}" cy="${y}" r="${r}" fill="var(--accent)" opacity=".12" stroke="var(--accent)" stroke-dasharray="2 3"/>
      <circle class="core" cx="${x}" cy="${y}" r="${open ? 7 : 5.5}" fill="${open ? "var(--accent)" : "var(--line)"}" stroke="var(--bg)" stroke-width="2"/>
      <text x="${lx}" y="${ly}" text-anchor="${anchor}" font-family="DM Sans, sans-serif" font-size="11" fill="var(--fg)" paint-order="stroke" stroke="var(--surface)" stroke-width="3">${esc(label)}</text></g>`;
  }
  if (meNear) svg += `<circle cx="${sx(me)}" cy="${sy(me)}" r="6" fill="var(--bg)" stroke="var(--heading)" stroke-width="2.5"/><text x="${sx(me)}" y="${sy(me) + 20}" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="11" fill="var(--heading)">You</text>`;
  svg += "</svg>";
  const list = near.map((m) => { const c = placeCheck(m); return `<button class="mem-btn" data-mem="${m.id}"><i class="dot ${c.inside && m.armed !== false ? "open" : ""}"></i><span><b>${esc(m.place.name)}</b><br><span class="muted small">${poss(m.author)} ${kindWord[m.kind]} · ${fmtDate(m.at)}</span></span><span class="meta">${c.known ? (c.inside ? "here" : fmtDist(c.dist)) : ""}</span></button>`; }).join("");
  return `<div class="local"><h3>${esc(near[0]?.place.name || "Here")}${near.length > 1 ? ` and ${near.length - 1} more nearby` : ""}</h3>${svg}<div>${list}</div></div>`;
}

}
const DEPTH = { welcome: 0, home: 0, claim: 0, map: 1, save: 1, memory: 2, pass: 1, privacy: 1 };
function go(name, extra = {}) {

}

/* ---------- press-and-hold ---------- */
function wireHolds() {
  for (const [id, fn] of [["holdSeal", () => doSeal()], ["holdPass", () => doPass()]]) {
    const el = document.getElementById(id); if (!el) continue;
    const fill = el.querySelector(".fill"); let raf = 0, t0 = 0;
    const DUR = 1500;
    const stop = () => { cancelAnimationFrame(raf); fill.style.transition = "transform .3s"; fill.style.transform = "scaleX(0)"; };
    const tick = () => { const p = Math.min(1, (performance.now() - t0) / DUR); fill.style.transform = `scaleX(${p})`; if (p >= 1) { phoneHaptic(30); fn(); } else raf = requestAnimationFrame(tick); };
    el.addEventListener("pointerdown", (e) => { e.preventDefault(); fill.style.transition = "none"; t0 = performance.now(); raf = requestAnimationFrame(tick); });
    for (const ev of ["pointerup", "pointerleave", "pointercancel"]) el.addEventListener(ev, stop);
    el.addEventListener("keydown", (e) => { if ((e.key === "Enter" || e.key === " ") && !e.repeat) { e.preventDefault(); fill.style.transition = "none"; t0 = performance.now(); raf = requestAnimationFrame(tick); } });
    el.addEventListener("keyup", stop);
    el.addEventListener("contextmenu", (e) => e.preventDefault());
  }
}

/* ---------- flows ---------- */
async function doSeal() {
  const d = S.view.draft;
  const p0 = d.spot || here();
  if (!p0) { toast("Keepsake is still finding where you are."); render(); return; }
  const { mediaUrl, ...keep } = d;
  if (!(await waitForTap("Tap your phone to the bag's tag to seal it", { type: "seal", draft: keep }))) { render(); return; }
  const p = p0;
  const meta = { kind: d.kind, text: d.text.trim(), author: d.author.trim() || currentOwner().name, at: Date.now(), mime: d.mime };
  const box = await seal(S.data.bag.key, meta, d.media);
  const m = { id: uid(), gen: currentOwner().gen, author: meta.author, kind: d.kind, at: meta.at, place: { name: d.placeName.trim() || p.name || `Near ${fmtCoords(p)}`, lat: p.lat, lng: p.lng, acc: p.acc || 0 }, radius: S.sim.radius, armed: false, box, responses: [] };
  S.data.memories.push(m); persist();
  if (d.mediaUrl) URL.revokeObjectURL(d.mediaUrl);
  // The memory slips down into the bag, the flap closes, the clasp snaps.
  if (!reduceMotion()) await finished($("#app").animate([{ transform: "none", opacity: 1 }, { transform: "translateY(90px) scale(.86)", opacity: 0 }], { duration: 480, easing: "cubic-bezier(.5,0,.75,.3)", fill: "forwards" }), { duration: 480 });
  await Bag.close(`Sealed at ${m.place.name}`);
  await Bag.snap();
  await sleep(reduceMotion() ? 600 : 900);
  S.justSealed = m.id; S.growLate = true;
  S.view = { name: "home" }; render(); $("#app").getAnimations().forEach((a) => a.cancel());
  bagFace(); window.scrollTo({ top: 0 });
  await Bag.open();
  toast(`Sealed at ${m.place.name}. It will wait for you there.`);
}
async function doPass(named) {
  const name = (named || $("#nextOwner")?.value || "").trim();
  if (!name) { toast("Add their name first."); render(); return; }
  S.view.next = name;
  if (!(await waitForTap(`${name}, tap your phone to the bag's tag`, { type: "pass", next: name }))) { render(); return; }
  const from = currentOwner().name;
  await Bag.close(`${from} hands the bag to ${name}`);
  await Bag.snap("pass");
  await sleep(500);
  await Bag.handOver();
  S.data.owners.push({ gen: currentOwner().gen + 1, name, since: Date.now() });
  persist();
  S.justPassed = true;
  S.view = { name: "pass", done: true }; render();
  Bag.setFace(S.data.bag.name, `Now carried by ${name}`, `${name}, press the clasp to open`);
  await Bag.waitForClasp();
  await Bag.open();
}
async function openMemory(m, viaHome) {
  if (!(await waitForTap("Tap your phone to the bag's tag to open it", { type: "open", id: m.id, viaHome }))) { render(); return; }
  const tap = Timing.take();
  const c = placeCheck(m);
  if (!c.known) { if (viaHome) { toast("Keepsake doesn't know where you are yet. Check that location is on."); render(); return; } S.view.notHere = "unknown"; render(); return; }
  if (!c.inside || m.armed === false) {
    if (viaHome) { toast(m.armed === false && c.inside ? "The memory sealed here opens once you've left and come back." : `No memory waits here. Nearest: ${m.place.name}, ${fmtDist(c.dist)} away.`); render(); return; }
    S.view.notHere = c.inside ? "unarmed" : "far"; render(); return;
  }
  await decryptInto(m);
  hideArrival();
  await boop("open", tap);
  S.view = { name: "memory", id: m.id, reveal: true, from: S.view.name === "map" ? "map" : "home" }; render();
  if (tap.at != null) Timing.add("tap→open", performance.now() - tap.at, tap.via);
}
async function decryptInto(m) {
  for (const item of [m, ...m.responses]) {
    const { meta, media } = await unseal(S.data.bag.key, item.box);
    const mediaUrl = media ? URL.createObjectURL(new Blob([media], { type: meta.mime || "application/octet-stream" })) : "";
    S.opened.set(item.id, { meta, mediaUrl, media });
  }
}
async function onFile(input) {
  const f = input.files?.[0]; if (!f) return;
  const d = S.view.draft;
  try {
    if (d.kind === "photo") {
      const blob = await toJpeg(f, 1600);
      d.media = await blob.arrayBuffer(); d.mime = "image/jpeg";
      if (d.mediaUrl) URL.revokeObjectURL(d.mediaUrl); d.mediaUrl = URL.createObjectURL(blob);
    } else {
      d.media = await f.arrayBuffer(); d.mime = f.type || "audio/mp4";
      if (d.mediaUrl) URL.revokeObjectURL(d.mediaUrl); d.mediaUrl = URL.createObjectURL(f);
    }
  } catch (e) { toast("That file couldn't be read. Try another one."); }
  render();
}
async function toJpeg(fileOrBlob, maxSide) {
  const img = await createImageBitmap(fileOrBlob);
  const k = Math.min(1, maxSide / Math.max(img.width, img.height));
  const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return new Promise((res, rej) => c.toBlob((b) => (b ? res(b) : rej(new Error("encode"))), "image/jpeg", 0.86));
}

  const btn = $("#exportBtn"), note = $("#exportNote");
  const downloads = window.claude?.use ? await window.claude.use("downloads").catch(() => null) : null;
  // Outside claude.ai (the home-screen app): the phone's share sheet, or a plain download.
  const saveFile = downloads ? (name, blob) => downloads.save({ filename: name, data: blob }) : Native ? async (name, blob) => {
    const base64 = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]); r.onerror = rej; r.readAsDataURL(blob); });

    const all = S.data.memories.flatMap((m) => [{ m, item: m, base: `${stamp(m.at)}_${safe(m.place.name)}_${safe(m.author)}` },
      ...m.responses.map((r) => ({ m, item: r, base: `${stamp(m.at)}_${safe(m.place.name)}_${safe(m.author)}_reply-${safe(r.author)}` }))]);
    for (const { m, item, base } of all) {
      const { meta, media } = await unseal(S.data.bag.key, item.box);
      const about = `Place: ${m.place.name} (${m.place.lat.toFixed(5)}, ${m.place.lng.toFixed(5)}, opens within ${m.radius} m)\nBy: ${meta.author}\nDate: ${new Date(meta.at).toString()}\n\n${meta.text || ""}\n`;
      files.push({ name: `${base}.txt`, data: enc.encode(about) });
      if (media && meta.kind === "photo") files.push({ name: `${base}.jpg`, data: new Uint8Array(media) });
      if (media && meta.kind === "voice") {
        try { files.push({ name: `${base}.wav`, data: await toWav(media) }); }
        catch { files.push({ name: `${base}.original-audio`, data: new Uint8Array(media) }); }
      }
    }
    files.push({ name: "README.txt", data: enc.encode(`${S.data.bag.name}\nExported ${new Date().toString()}\n\nCarried by: ${S.data.owners.map((o) => `${o.name} (generation ${o.gen})`).join(", ")}\n\nEach memory has a .txt with its place, author and words, plus a .jpg or .wav if it had one.\nThese are ordinary files. They open on any computer, with or without the app.\n`) });

}

/* ---------- one Keepsake tab at a time ---------- */
// iPhone opens every tag tap in a new Safari tab, and a web page can't change that (the iPhone app
// will read tags in place). So the newest tab wins and older ones step aside, rather than
// several tabs holding different states of the same bag.
const tabs = "BroadcastChannel" in window ? new BroadcastChannel("keepsake-tabs") : null;
const TAB_ID = uid();
tabs?.addEventListener("message", (e) => { if (e.data?.type === "newest" && e.data.id !== TAB_ID) retireTab(); });
function retireTab() {

  try { if (Loc.watchId != null) navigator.geolocation.clearWatch(Loc.watchId); } catch {}
  S.opened.clear();
  document.body.innerHTML = `<div style="min-height:100vh;display:grid;place-items:center;padding:32px 24px;text-align:center;background:#3D1C1A;color:#E6C48A;font-family:'DM Sans',sans-serif">
    <div><p style="font-family:'Instrument Serif',Georgia,serif;font-size:34px;line-height:1.1;margin:0 0 12px;color:#F2E4CC">Keepsake moved to your newest tab.</p>
    <p style="margin:0;opacity:.85">Tapping the bag opens Keepsake in a new tab. You can close this one.</p></div></div>`;
  try { window.close(); } catch {}
}

(async () => {
  if (!Native) tabs?.postMessage({ type: "newest", id: TAB_ID });
  renderSim();
  const saved = await loadState();
  const tag = LinkTags.initial(); // this page was opened by a tag tap: its time counts from navigation start
  startNfc(); // Chrome on Android, once NFC was allowed: read the tag in place from now on
  if (!saved?.onboarded || !saved.bag?.id) {
    // First launch: get to know the person before handing them a bag.
    Bag.el.hidden = true; Bag.isOpen = true; $("#shell").inert = false;
    S.view = { name: "welcome", step: "hello" }; render();
    if (tag) await onTagTap(tag);
    return;
  }
  S.data = saved;
  if (tag) { if (Loc.wasAllowed()) Loc.start(); return onTagTap(tag); }
  if (S.data.isExample && ["The cognac satchel", "Heartwood"].includes(S.data.bag.name)) { S.data.bag.name = "Keepsake"; persist(); }
  S.view = { name: "home" };
  render(); bagFace();
  $("#clasp").focus({ preventScroll: true });
  if (Loc.wasAllowed()) Loc.start();
})();
