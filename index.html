<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3D1C1A">
<meta name="description" content="A leather heirloom bag that carries each generation's memories forward.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Keepsake">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; font: 14px/1.4 system-ui, -apple-system, sans-serif; }
img { max-width: 100%; }
[hidden] { display: none !important; }
html { -webkit-tap-highlight-color: transparent; }
body { overscroll-behavior-y: none; }
</style>
</head>
<body>
<title>Keepsake</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap">
<style>
/* Layout: one phone-width app column; on wide screens the virtual bag sits beside it, on phones it's a pull-up sheet. */
:root {
  --bg: #F9F6F0;        /* cream paper */
  --surface: #F2ECE2;   /* slightly deeper paper for wells */
  --fg: #2A1A15;        /* deep brown ink */
  --muted: #6E5A4E;
  --primary: #3D1C1A;   /* oxblood */
  --on-primary: #F9F6F0;
  --accent: #B5662F;    /* cognac */
  --line: #B08D57;      /* brass hairline */
  --deboss-hi: rgba(255,255,255,.85);
  --deboss-lo: rgba(61,28,26,.22);
  --ok: #3E6B3A;
  --warn: #8A3B1E;
  --grain-opacity: .05;
  --grain-filter: none;
  --heading: #3D1C1A;   /* titles: oxblood ink */
  --core: #3D1C1A;      /* centre of the rings: the first owner */
  --bg-image: none;
  --display: "Instrument Serif", "Bodoni 72", "Didot", Georgia, serif;
  --body: "DM Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
  --ease: cubic-bezier(.32,.08,.24,1);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #2A1912; --surface: #3A241A; --fg: #F2E4CC; --muted: #C7AE90; --heading: #EFD9B2; --core: #5C3524;
  --primary: #C9A469; --on-primary: #2A1912; --accent: #CF9A63; --line: #9E7E55;
  --deboss-hi: rgba(255,228,186,.07); --deboss-lo: rgba(0,0,0,.55);
  --ok: #9CC48D; --warn: #E8A388; --grain-opacity: .11; --grain-filter: invert(1);
  --bg-image: radial-gradient(130% 70% at 50% -8%, #42291D 0%, #2A1912 55%, #1E120D 100%);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #2A1912; --surface: #3A241A; --fg: #F2E4CC; --muted: #C7AE90; --heading: #EFD9B2; --core: #5C3524;
  --primary: #C9A469; --on-primary: #2A1912; --accent: #CF9A63; --line: #9E7E55;
  --deboss-hi: rgba(255,228,186,.07); --deboss-lo: rgba(0,0,0,.55);
  --ok: #9CC48D; --warn: #E8A388; --grain-opacity: .11; --grain-filter: invert(1);
  --bg-image: radial-gradient(130% 70% at 50% -8%, #42291D 0%, #2A1912 55%, #1E120D 100%);
  color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background-color: var(--bg); background-image: var(--bg-image); background-attachment: fixed;
  color: var(--fg); font-family: var(--body); font-size: 17px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
body::before { /* leather grain */
  content: ""; position: fixed; inset: 0; pointer-events: none; opacity: var(--grain-opacity); z-index: 0; filter: var(--grain-filter);
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .2  0 0 0 0 .1  0 0 0 0 .05  0 0 0 1 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
.shell {
  position: relative; z-index: 1; min-height: 100%;
  display: grid; justify-content: center; grid-template-columns: minmax(0, 440px);
  gap: 32px; padding-block: 12px 120px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
@media (min-width: 900px) {
  .shell { grid-template-columns: minmax(0, 440px) 320px; padding-block: 32px 48px; align-items: start; }
}
main { min-width: 0; display: flex; flex-direction: column; gap: 20px; }

h1, h2, h3 { font-family: var(--display); font-weight: 400; margin: 0; text-wrap: balance; letter-spacing: -.005em; }
h1 { font-size: 46px; line-height: 1; color: var(--heading); }
h2 { font-size: 34px; line-height: 1.05; color: var(--heading); }
h3 { font-size: 24px; line-height: 1.15; }
p { margin: 0; max-width: 34em; }
.muted { color: var(--muted); }
.small { font-size: 15px; }
.eyebrow { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.stitch { border: 0; border-top: 1.5px dashed var(--line); margin: 4px 0; opacity: .9; }

.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; }
.pill { font-size: 13px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }

button, .btn { font: inherit; cursor: pointer; }
.btn {
  display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%;
  min-height: 56px; padding: 12px 20px; border-radius: 14px; font-size: 19px; font-weight: 500;
  border: 1.5px solid var(--primary); background: transparent; color: var(--primary);
  transition: transform .3s var(--ease), opacity .3s var(--ease);
}
.btn.primary { background: var(--primary); color: var(--on-primary); }
.btn:active { transform: scale(.985); }
.btn[disabled] { opacity: .45; cursor: default; }
.link { background: none; border: 0; color: var(--primary); text-decoration: underline; text-underline-offset: 3px; min-height: 44px; padding: 8px 4px; font-size: 17px; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 8px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; }
.row > * { flex: 1 1 140px; }
.stack { display: flex; flex-direction: column; gap: 12px; }

/* Debossed tap target */
.deboss {
  position: relative; width: 196px; height: 196px; border-radius: 50%; margin: 8px auto; border: 0;
  background: radial-gradient(circle at 50% 45%, var(--surface), var(--bg) 70%);
  box-shadow: inset 6px 8px 14px var(--deboss-lo), inset -6px -6px 12px var(--deboss-hi), 0 0 0 1px var(--line);
  display: grid; place-items: center; color: var(--primary); font-family: var(--display); font-size: 26px;
  transition: transform .4s var(--ease);
}
.deboss::after { /* stitched inner ring */
  content: ""; position: absolute; inset: 14px; border-radius: 50%; border: 1.5px dashed var(--line); opacity: .8;
}
.deboss.waiting { animation: breathe 2.4s var(--ease) infinite; }
.deboss.small { width: 120px; height: 120px; font-size: 20px; }
@keyframes breathe { 0%,100% { box-shadow: inset 6px 8px 14px var(--deboss-lo), inset -6px -6px 12px var(--deboss-hi), 0 0 0 1px var(--line); }
  50% { box-shadow: inset 6px 8px 14px var(--deboss-lo), inset -6px -6px 12px var(--deboss-hi), 0 0 0 8px color-mix(in srgb, var(--accent) 22%, transparent); } }
.buzz { animation: buzz .5s linear 1; }
@keyframes buzz { 0%,100% { transform: translate(0,0); } 20% { transform: translate(-2px,1px); } 40% { transform: translate(2px,-1px); } 60% { transform: translate(-2px,0); } 80% { transform: translate(1px,1px); } }

/* Rings */
.rings { width: 100%; max-width: 360px; margin: 0 auto; display: block; aspect-ratio: 1; }
.rings .mark { cursor: pointer; }
.rings .mark:focus-visible { outline: none; }
.rings .mark:focus-visible circle { stroke: var(--accent); stroke-width: 3; }
.grow { transform-box: fill-box; transform-origin: center; animation: grow .6s var(--ease) 1; }
@keyframes grow { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.ring-new { animation: ringIn .6s var(--ease) 1; transform-origin: 160px 160px; }
@keyframes ringIn { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }

.chapters { display: flex; flex-direction: column; gap: 4px; }
.chapter-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-top: 8px; }
.mem-btn {
  display: grid; grid-template-columns: 28px 1fr auto; align-items: center; gap: 12px; width: 100%; text-align: left;
  min-height: 56px; padding: 10px 4px; border: 0; border-bottom: 1px dashed color-mix(in srgb, var(--line) 60%, transparent);
  background: none; color: var(--fg);
}
.mem-btn .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--line); justify-self: center; }
.mem-btn .dot.open { background: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 25%, transparent); }
.mem-btn span { min-width: 0; }
.mem-btn .meta { font-size: 14px; color: var(--muted); white-space: nowrap; }
.gap-note { font-family: var(--display); font-style: italic; font-size: 20px; color: var(--accent); padding: 8px 4px; }

/* Choices */
.choice {
  display: grid; grid-template-columns: 56px 1fr; gap: 14px; align-items: center; text-align: left; width: 100%;
  min-height: 84px; padding: 14px 16px; border-radius: 16px; border: 1.5px solid var(--line); background: var(--surface); color: var(--fg);
}
.choice svg { width: 44px; height: 44px; stroke: var(--primary); fill: none; stroke-width: 1.6; }
.choice b { font-family: var(--display); font-weight: 400; font-size: 26px; color: var(--heading); display: block; line-height: 1.1; }

.prompts { display: flex; flex-direction: column; gap: 6px; font-family: var(--display); font-size: 25px; line-height: 1.2; color: var(--heading); }
.prompts span::before { content: "— "; color: var(--line); }
label { font-size: 15px; font-weight: 500; color: var(--muted); display: block; margin-bottom: 6px; }
input[type=text], textarea {
  width: 100%; font: inherit; font-size: 18px; color: var(--fg); background: var(--surface);
  border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px;
}
textarea { min-height: 150px; resize: vertical; }
input[type=range] { width: 100%; accent-color: var(--accent); min-height: 44px; }
.record {
  width: 168px; height: 168px; border-radius: 50%; border: 0; margin: 8px auto; display: grid; place-items: center;
  background: var(--primary); color: var(--on-primary); font-size: 20px; font-weight: 500; text-align: center; line-height: 1.2;
  box-shadow: 0 0 0 8px color-mix(in srgb, var(--primary) 15%, transparent);
}
.record.recording { background: var(--accent); animation: breathe 1.6s var(--ease) infinite; }
.preview img { width: 100%; border-radius: 12px; display: block; }
audio { width: 100%; }

/* Hold-to-seal */
.hold { position: relative; overflow: hidden; }
.hold .fill { position: absolute; inset: 0; background: var(--accent); transform-origin: left; transform: scaleX(0); opacity: .9; }
.hold span { position: relative; }

/* Reveal */
.memory-card { background: var(--surface); border-radius: 18px; padding: 20px; border: 1px solid color-mix(in srgb, var(--line) 50%, transparent); display: flex; flex-direction: column; gap: 14px; }
.memory-card.reveal { animation: reveal 1.3s var(--ease) 1; }
@keyframes reveal { 0% { opacity: 0; filter: blur(14px); transform: scale(.97); } 60% { opacity: 1; } 100% { filter: blur(0); transform: scale(1); } }
.memory-text { font-family: var(--display); font-size: 25px; line-height: 1.3; white-space: pre-wrap; }
.locked { display: grid; gap: 10px; place-items: center; text-align: center; padding: 28px 12px; }
.lock-ring { width: 72px; height: 72px; border-radius: 50%; border: 1.5px dashed var(--line); display: grid; place-items: center; }
.response { border-left: 2px dashed var(--line); padding-left: 14px; display: flex; flex-direction: column; gap: 8px; }

.notice { border-radius: 14px; padding: 14px 16px; background: color-mix(in srgb, var(--accent) 12%, var(--bg)); border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); }
.notice.bad { background: color-mix(in srgb, var(--warn) 10%, var(--bg)); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
.kv { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; padding: 12px 0; border-bottom: 1px dashed color-mix(in srgb, var(--line) 60%, transparent); }
.kv b { font-weight: 600; }
code, .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px; word-break: break-all; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(92px + env(safe-area-inset-bottom, 0px)); z-index: 36;
  background: var(--primary); color: var(--on-primary); padding: 12px 18px; border-radius: 12px; max-width: min(92vw, 420px); font-size: 16px;
  box-shadow: 0 8px 30px rgba(0,0,0,.2);
}

/* Virtual bag panel */
.sim {
  background: var(--surface); border: 1.5px dashed var(--line); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 14px;
}
.sim h3 { font-size: 26px; color: var(--heading); }
.sim select { width: 100%; font: inherit; font-size: 16px; min-height: 48px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg); color: var(--fg); padding: 8px 10px; }
.sim .bagface { display: grid; justify-items: center; gap: 6px; }
.toggle { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 44px; font-size: 16px; }
.toggle input { width: 24px; height: 24px; accent-color: var(--accent); }
.sim-open {
  position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 20;
  min-height: 56px; padding: 0 20px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); color: var(--primary);
  font-size: 17px; font-weight: 500; box-shadow: 0 6px 24px rgba(0,0,0,.15); display: flex; align-items: center; gap: 10px;
}
.sim-open .led { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
.sim-open .led.on { background: var(--accent); animation: breathe 1.6s infinite; }
@media (max-width: 899px) {
  aside.sim { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; border-radius: 20px 20px 0 0; max-height: 82vh; overflow-y: auto;
    padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px));
    padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -12px 40px rgba(0,0,0,.18); border-bottom: 0; }
  aside.sim[data-closed] { display: none; }
}
@media (min-width: 900px) { .sim-open, .sim-close { display: none !important; } aside.sim { position: sticky; top: calc(24px + env(safe-area-inset-top, 0px)); } }

/* ---------- The bag itself: leather stays leather in both themes ---------- */
:root { --leather: #8A4422; --leather-deep: #3D1C1A; --leather-mid: #5E2A1C; --stitch: #E6C48A; --brass-hi: #F4DFA8; --brass: #B08D57; --brass-lo: #7A5C2E; --lining-shadow: rgba(46,20,12,.30); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --lining-shadow: rgba(0,0,0,.65); } }
:root[data-theme="dark"] { --lining-shadow: rgba(0,0,0,.65); }

.bag { position: fixed; inset: 0; z-index: 40; perspective: 1600px; overflow: hidden; background: var(--leather-deep); }
.bag-body, .bag-flap { position: absolute; left: 0; right: 0; }
.bag-body {
  inset: 0;
  background: radial-gradient(120% 70% at 50% 100%, var(--leather) 0%, var(--leather-mid) 70%, var(--leather-deep) 100%);
}
.bag-body::before { /* stitched seam around the bag front */
  content: ""; position: absolute; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); top: 40%;
  border: 2px dashed var(--stitch); border-top: 0; border-radius: 0 0 26px 26px; opacity: .55;
}
.leather-grain::after {
  content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .32; mix-blend-mode: multiply; border-radius: inherit;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='1.1' numOctaves='4' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .25  0 0 0 0 .12  0 0 0 0 .06  0 0 0 1.2 -.1'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
.bag-flap {
  top: 0; height: 58%; transform-origin: 50% 0; backface-visibility: hidden;
  background: linear-gradient(180deg, var(--leather-deep) 0%, var(--leather-mid) 78%, #6B301E 100%);
  border-radius: 0 0 50% 50% / 0 0 20% 20%;
  box-shadow: 0 22px 36px rgba(20,8,4,.5), inset 0 -2px 0 rgba(255,220,170,.12);
}
.flap-stitch {
  position: absolute; left: 14px; right: 14px; top: -4px; bottom: 14px;
  border: 2px dashed var(--stitch); border-top: 0; border-radius: 0 0 50% 50% / 0 0 21% 21%; opacity: .75;
}
.flap-name {
  position: absolute; left: 0; right: 0; top: 34%; text-align: center; padding: 0 32px;
  font-family: var(--display); font-size: 44px; line-height: 1; text-wrap: balance;
  color: rgba(24,8,4,.62); text-shadow: 0 1px 0 rgba(255,214,160,.26), 0 -1px 0 rgba(0,0,0,.4); /* debossed */
}
.flap-sub { display: block; font-family: var(--body); font-size: 13px; letter-spacing: .2em; text-transform: uppercase; margin-top: 14px; color: rgba(255,224,180,.38); text-shadow: none; }
.clasp {
  position: absolute; left: 50%; top: calc(58% - 40px); width: 80px; height: 80px; margin-left: -40px; border-radius: 50%; border: 0; z-index: 2;
  background: radial-gradient(circle at 34% 28%, var(--brass-hi) 0%, var(--brass) 42%, var(--brass-lo) 100%);
  box-shadow: 0 6px 14px rgba(0,0,0,.45), inset 0 -4px 8px rgba(60,40,10,.35), inset 0 3px 4px rgba(255,245,210,.45);
  cursor: pointer;
}
.clasp::before { content: ""; position: absolute; inset: 16px; border-radius: 50%; border: 2px solid rgba(90,62,24,.55); box-shadow: inset 0 2px 3px rgba(0,0,0,.25), 0 1px 0 rgba(255,240,200,.4); }
.clasp:focus-visible { outline: 3px solid var(--stitch); outline-offset: 6px; }
.clasp.ready { animation: claspGlow 2.6s var(--ease) infinite; }
@keyframes claspGlow { 0%,100% { box-shadow: 0 6px 14px rgba(0,0,0,.45), inset 0 -4px 8px rgba(60,40,10,.35), inset 0 3px 4px rgba(255,245,210,.45), 0 0 0 0 rgba(230,196,138,0); }
  50% { box-shadow: 0 6px 14px rgba(0,0,0,.45), inset 0 -4px 8px rgba(60,40,10,.35), inset 0 3px 4px rgba(255,245,210,.45), 0 0 0 14px rgba(230,196,138,.16); } }
.bag-hint {
  position: absolute; left: 0; right: 0; top: calc(58% + 64px); text-align: center; padding: 0 24px; margin: 0; max-width: none;
  color: var(--stitch); font-size: 15px; letter-spacing: .14em; text-transform: uppercase; opacity: .85;
}
/* Inside the bag: the flap's shadow across the mouth of the bag */
.mouth { position: fixed; left: 0; right: 0; top: 0; height: calc(64px + env(safe-area-inset-top, 0px)); z-index: 5; pointer-events: none;
  background: linear-gradient(180deg, var(--lining-shadow), transparent); }
/* Stitched pockets that hold each chapter */
.pocket {
  position: relative; border-radius: 10px 10px 22px 22px; padding: 24px 22px 12px;
  background: var(--surface); border: 1px solid color-mix(in srgb, var(--line) 45%, transparent);
  box-shadow: inset 0 14px 14px -12px var(--lining-shadow);
}
.pocket::before { content: ""; position: absolute; left: 10px; right: 10px; top: 8px; border-top: 1.5px dashed var(--line); opacity: .9; }
.pocket::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: 7px; top: 8px; border: 1.5px dashed var(--line); border-top: 0; border-radius: 0 0 16px 16px; opacity: .45; pointer-events: none; }
.pocket .chapter-head { margin-top: 0; }
.pocket .mem-btn:last-child { border-bottom: 0; }
.chapters { gap: 16px; }
.memory-card.reveal { animation: liftOut 1.3s var(--ease) 1; }
@keyframes liftOut { 0% { opacity: 0; filter: blur(14px); transform: translateY(70px) scale(.96); } 55% { opacity: 1; } 100% { filter: blur(0); transform: none; } }
.grow.late { animation-delay: 1.25s; animation-fill-mode: both; }

/* ---------- onboarding, place, globe ---------- */
.onboard { padding-top: 28px; }
/* "Tap your phone to the tag": a picture of what to do, not a button */
.tag-prompt { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
.tag-prompt .deboss { cursor: default; }
.tag-prompt .deboss svg, .arrival .ring svg { width: 56%; height: 56%; stroke: var(--primary); fill: none; stroke-width: 1.6; }
.tag-prompt .deboss.small svg { width: 52%; height: 52%; }
.tag-prompt b { font-family: var(--display); font-weight: 400; font-size: 24px; line-height: 1.15; color: var(--heading); }
/* The bag is buzzing: a memory waits here */
.arrival { position: fixed; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 35;

<script src="keepsake.config.js"></script>
<script src="bag-haptics.js"></script>

<script>
"use strict";
/* ============================================================
   A Purse That Remembers: interactive prototype
   Same model as the app: the bag holds a bag ID + key; the phone
   encrypts (AES-256-GCM), checks place, decrypts, and boops.
   NFC, Bluetooth and GPS are simulated by the Virtual bag panel.
   ============================================================ */

const PLACES = [
  { id: "home",    name: "Home, at the kitchen table",   lat: 41.83500, lng: -71.40000 },
  { id: "terrace", name: "Prospect Terrace Park",        lat: 41.82966, lng: -71.40724 },
  { id: "atwells", name: "Atwells Avenue, Federal Hill", lat: 41.82370, lng: -71.42430 },
  { id: "india",   name: "India Point Park",             lat: 41.81960, lng: -71.39150 },
  { id: "museum",  name: "RISD Museum",                  lat: 41.82680, lng: -71.40860 },
];
const OFFSETS = [ [0, "Right here"], [40, "40 m away"], [120, "120 m away"], [400, "400 m away"], [3000, "3 km away"] ];

/* ---------- small helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const reduceMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
const uid = () => Array.from(crypto.getRandomValues(new Uint8Array(6)), (b) => b.toString(16).padStart(2, "0")).join("");
const B64 = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_";
function b64url(bytes) { let o = ""; for (let i = 0; i < bytes.length; i += 3) { const n = (bytes[i] << 16) | ((bytes[i+1] ?? 0) << 8) | (bytes[i+2] ?? 0); const c = i + 1 >= bytes.length ? 2 : i + 2 >= bytes.length ? 3 : 4; for (let k = 0; k < c; k++) o += B64[(n >> (18 - 6*k)) & 63]; } return o; }
function unb64url(s) { const o = []; let buf = 0, bits = 0; for (const ch of s) { buf = ((buf << 6) | B64.indexOf(ch)) & 0xffff; bits += 6; if (bits >= 8) { bits -= 8; o.push((buf >> bits) & 255); } } return Uint8Array.from(o); }
const sentence = (t) => (/[.!?]$/.test(t) ? t : t + ".");
const poss = (name) => (name === "You" ? "Your" : `${esc(name)}'s`);
function fmtDate(ts) { return new Date(ts).toLocaleDateString(undefined, { month: "long", year: "numeric" }); }
function fmtDist(m) { return m < 1000 ? `${Math.round(m)} m` : `${(m/1000).toFixed(1)} km`; }
function haversine(a, b) {
  const R = 6371000, toR = Math.PI / 180;
  const dLat = (b.lat - a.lat) * toR, dLng = (b.lng - a.lng) * toR;
  const h = Math.sin(dLat/2)**2 + Math.cos(a.lat*toR) * Math.cos(b.lat*toR) * Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function toast(msg, ms = 3200) {
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => (t.hidden = true), ms);
}
function phoneHaptic(pattern = [40, 150, 70]) {
  if (window.ReactNativeWebView) { window.ReactNativeWebView.postMessage(JSON.stringify({ type: "haptic", pattern })); return; }
  try { navigator.vibrate?.(pattern); } catch {}
}

/* ---------- crypto: AES-256-GCM, key lives on the bag ---------- */
async function importKey(keyB64) { return crypto.subtle.importKey("raw", unb64url(keyB64), "AES-GCM", false, ["encrypt", "decrypt"]); }
// Plaintext layout: [4-byte meta length][meta JSON][media bytes]
async function seal(keyB64, meta, media) {
  const m = new TextEncoder().encode(JSON.stringify(meta));
  const body = new Uint8Array(4 + m.length + (media ? media.byteLength : 0));
  new DataView(body.buffer).setUint32(0, m.length); body.set(m, 4);
  if (media) body.set(new Uint8Array(media), 4 + m.length);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, await importKey(keyB64), body);
  return { iv: b64url(iv), ct: new Uint8Array(ct) };
}
async function unseal(keyB64, box) {
  const pt = new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64url(box.iv) }, await importKey(keyB64), box.ct));
  const n = new DataView(pt.buffer).getUint32(0);
  const meta = JSON.parse(new TextDecoder().decode(pt.subarray(4, 4 + n)));
  const media = pt.length > 4 + n ? pt.slice(4 + n).buffer : null;
  return { meta, media };
}

/* ---------- storage (this browser only; stands in for the phone) ---------- */
const DB_NAME = "purse-prototype", STORE = "kv";
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(STORE);
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function loadState() {
  try { const db = await idb(); return await new Promise((res) => { const g = db.transaction(STORE).objectStore(STORE).get("state"); g.onsuccess = () => res(g.result || null); g.onerror = () => res(null); }); }
  catch { return null; }
}
let saveTimer = null;
function persist() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try { const db = await idb(); db.transaction(STORE, "readwrite").objectStore(STORE).put(S.data, "state"); } catch {}
  }, 200);
}
async function wipeStorage() { try { const db = await idb(); db.transaction(STORE, "readwrite").objectStore(STORE).delete("state"); } catch {} }

/* ---------- state ---------- */
// data: persisted. Everything else lives only while the page is open.
const S = {
  data: null,              // { bag, owners, memories, isExample }
  view: { name: "home" },
  opened: new Map(),       // memoryId -> {meta, mediaUrl}  (decrypted, memory only)
  sim: { place: "real", offset: 0, radius: 50, near: true, powered: true, tagBlank: false, lastBuzz: 0 },
  ob: { name: "" },        // onboarding answers before a bag exists
  waitTap: null,           // { label, resolve }
  justSealed: null,
};
const currentOwner = () => S.data.owners[S.data.owners.length - 1];
// Testing settings survive a tag tap (which opens a fresh page): pretend place, distance, radius.
try { const v = JSON.parse(localStorage.getItem("keepsake.sim") || "null"); if (v && (v.place === "real" || PLACES.some((p) => p.id === v.place))) Object.assign(S.sim, { place: v.place, offset: +v.offset || 0, radius: +v.radius || 50 }); } catch {}
function saveSim() { try { localStorage.setItem("keepsake.sim", JSON.stringify({ place: S.sim.place, offset: S.sim.offset, radius: S.sim.radius })); } catch {} }
function pretendNote() {
  if (S.sim.place === "real") return "";
  const p = PLACES.find((x) => x.id === S.sim.place);
  return `<div class="notice small">Pretending you're at <b>${esc(p?.name)}</b>${S.sim.offset ? `, ${fmtDist(S.sim.offset)} away` : ""}. To use your real location, change it in the Virtual bag panel.</div>`;
}

/* ---------- talking to the Keepsake app (when this page runs inside it) ---------- */
// The native app answers requests the page can't make itself: precise GPS, place names,
// the share sheet. In a plain browser Native is null and the page uses web APIs instead.
const Native = (() => {
  const rn = window.ReactNativeWebView;
  if (!rn) return null;
  const pending = new Map(), listeners = new Set();
  let next = 0;
  window.__keepsakeNative = (msg) => {
    if (msg.id && pending.has(msg.id)) {
      const p = pending.get(msg.id); pending.delete(msg.id);
      msg.error ? p.reject(new Error(msg.error)) : p.resolve(msg.result);
    } else if (msg.event) listeners.forEach((fn) => fn(msg));
  };
  return {
    call: (type, args = {}) => new Promise((resolve, reject) => {
      const id = String(++next);
      pending.set(id, { resolve, reject });
      rn.postMessage(JSON.stringify({ id, type, ...args }));
    }),
    on: (fn) => listeners.add(fn),
  };
})();

/* ---------- where the phone is ---------- */
// The phone's own location by default. The Virtual bag panel can swap in a pretend place for testing.
const Loc = {
  fix: null,        // { lat, lng, acc, at }
  status: "off",    // off | asking | on | denied | unavailable
  wasAllowed() { try { return localStorage.getItem("keepsake.location") === "on"; } catch { return false; } },
  remember(on) { try { localStorage.setItem("keepsake.location", on ? "on" : "off"); } catch {} },
  async start() {
    if (this.status === "on" || this.status === "asking") return this.status;
    this.status = "asking"; renderSim();
    try {
      if (Native) {
        const r = await Native.call("location.start");
        this.status = r?.granted ? "on" : "denied";
      } else if (navigator.geolocation) {
        await new Promise((resolve) => {
          // Fast first answer: the phone's recent position (under a minute old) usually comes back at once,
          // so a tag tap doesn't wait for a fresh GPS fix. The watch below refines it within seconds.
          navigator.geolocation.getCurrentPosition(
            (pos) => { if (!this.fix) { this.status = "on"; this.update(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy); resolve(); } },
            () => {}, { enableHighAccuracy: false, maximumAge: 60000, timeout: 4000 });
          this.watchId = navigator.geolocation.watchPosition(
            (pos) => { this.status = "on"; this.update(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy); resolve(); },
            (err) => { if (!this.fix) this.status = err.code === 1 ? "denied" : "unavailable"; resolve(); },
            { enableHighAccuracy: true, maximumAge: 3000, timeout: 30000 });
        });
      } else this.status = "unavailable";
    } catch { this.status = "unavailable"; }
    this.remember(this.status === "on");
    renderSim();
    return this.status;
  },
  update(lat, lng, acc) {
    this.fix = { lat, lng, acc, at: Date.now() };
    onLocationChange();
  },
};
Native?.on((msg) => { if (msg.event === "location") { Loc.status = "on"; Loc.update(msg.lat, msg.lng, msg.acc); } });

/** Where the phone is right now, or null while it's still finding out. */
function here() {
  if (S.sim.place !== "real") {
    const p = PLACES.find((x) => x.id === S.sim.place) || PLACES[0];
    return { name: p.name, lat: p.lat + S.sim.offset / 111320, lng: p.lng, acc: 0, pretend: true };
  }
  return Loc.fix ? { name: "", ...Loc.fix } : null;
}

/** How far the phone is from a memory's place, and whether that counts as "back there". */
function placeCheck(m) {
  const p = here();
  if (!p) return { known: false, dist: Infinity, inside: false, far: false };
  const dist = haversine(p, m.place);
  // Phone GPS is good to a few metres outdoors: give it the benefit of its own accuracy, capped.
  const slack = Math.min(p.acc || 0, 25);
  return { known: true, dist, inside: dist <= m.radius + slack, far: dist > m.radius + slack + 15 };
}

function fmtCoords(p) {
  const f = (v, pos, neg) => `${Math.abs(v).toFixed(5)}° ${v >= 0 ? pos : neg}`;
  return `${f(p.lat, "N", "S")}, ${f(p.lng, "E", "W")}`;
}
function locStatusText() {
  const f = Loc.fix;
  return Loc.status === "on" && f ? `Located to within ${Math.round(f.acc)} m · ${fmtCoords(f)}`
    : Loc.status === "on" || Loc.status === "asking" ? "Finding where you are…"
    : Loc.status === "denied" ? "Location is off for Keepsake. Turn it on in your phone's Settings, or pretend below."
    : Loc.status === "unavailable" ? "Location isn't available here. Pick a pretend place below."
    : "Location isn't on yet.";
}

/** Suggest a name for the spot: the place itself for pretend places, the phone's map lookup in the app. */
async function suggestPlaceName(p, d) {
  if (p.pretend) { d.placeName = p.name; return; }
  if (!Native) return;
  d.naming = true;
  try {
    const name = await Native.call("location.name", { lat: p.lat, lng: p.lng });
    if (name && !d.placeTyped) {
      d.placeName = name;
      const input = document.getElementById("placeName");
      if (input && document.activeElement !== input) input.value = name;
    }
  } catch {}
  d.naming = false;
  const input = document.getElementById("placeName");
  if (input) input.placeholder = "Name this place";
}

/** Close an opened memory again: its words and media leave memory. */
function closeMemory(m) {
  for (const item of [m, ...m.responses]) {
    const o = S.opened.get(item.id);
    if (o?.mediaUrl) URL.revokeObjectURL(o.mediaUrl);
    S.opened.delete(item.id);
  }
}

let renderTimer = 0, simTimer = 0;
/** Runs whenever the phone's position (real or pretend) changes. */
function onLocationChange(now = false) {
  if (!S.data) return;
  // A memory sealed here only opens after its keeper has left and come back.
  let changed = false;
  for (const m of S.data.memories) if (m.armed === false && placeCheck(m).far) { m.armed = true; changed = true; }
  if (changed) persist();
  checkArrival();
  // Walked away from an open memory: it closes.
  if (S.view.name === "memory" && S.opened.has(S.view.id)) {
    const m = S.data.memories.find((x) => x.id === S.view.id);
    if (m && placeCheck(m).far) { closeMemory(m); render(); toast("You've walked away, so the memory closed again."); return; }
  }
  if (now) return;
  // Keep distances on screen current, without re-rendering under someone's fingers.
  if (!simTimer) simTimer = setTimeout(() => { simTimer = 0; if (!$("#sim").contains(document.activeElement)) { const el = $("#locStatus"); if (el) el.textContent = locStatusText(); } }, 800);
  if (!renderTimer) renderTimer = setTimeout(() => {
    renderTimer = 0;
    if (S.waitTap || document.activeElement?.matches?.("input, textarea, select")) return;
    const v = S.view;
    if ((v.name === "memory" && !S.opened.has(v.id)) || (v.name === "save" && v.step === "place")) { saveDraftFields(); render(); }
    else if (v.name === "map") Globe.refresh();
  }, 1500);
}

/* ---------- real voice recording (when the browser allows it) ---------- */
const rec = { mr: null, chunks: [], t0: 0, timer: 0 };
async function toggleRecording() {
  const d = S.view.draft;
  if (rec.mr) { rec.mr.stop(); return; }
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch { document.getElementById("fileVoice")?.click(); return; } // no microphone here: pick a recording instead
  const type = ["audio/mp4", "audio/webm;codecs=opus", "audio/webm"].find((t) => window.MediaRecorder?.isTypeSupported?.(t)) || "";
  rec.mr = new MediaRecorder(stream, type ? { mimeType: type } : undefined); rec.chunks = [];
  rec.mr.ondataavailable = (e) => e.data.size && rec.chunks.push(e.data);
  rec.mr.onstop = async () => {
    stream.getTracks().forEach((t) => t.stop()); clearInterval(rec.timer);
    const blob = new Blob(rec.chunks, { type: rec.mr.mimeType || type || "audio/mp4" }); rec.mr = null;
    d.media = await blob.arrayBuffer(); d.mime = blob.type;
    if (d.mediaUrl) URL.revokeObjectURL(d.mediaUrl); d.mediaUrl = URL.createObjectURL(blob);
    render();
  };
  rec.mr.start(); rec.t0 = Date.now(); phoneHaptic(20);
  rec.timer = setInterval(() => { const el = $("#recTime"); if (el) { const s = Math.floor((Date.now() - rec.t0) / 1000); el.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; } }, 250);
  render();
}

/* ---------- the virtual bag: NFC tap + BLE boop ---------- */
/* ---------- the real tag in the bag ---------- */
// The bag's NFC tag (NTAG215 or NTAG 424 DNA) holds one web link:
//   https://keepsake-bag.expo.app/#v1.<bagId>.<key>     (docs/tag-format.md)
// An iPhone reads it with no app open and offers to open it in Safari. So a real tap
// arrives as Keepsake loading with that link. Anything the person was in the middle of
// (sealing, opening, passing down, claiming) is saved first and carried on after the tap.
const CONFIG = window.KEEPSAKE_CONFIG;
// Where the tag's link points: the config's tagHost, or this app's own address when it's served over https.
const TAG_HOST = CONFIG.tagHost || (location.protocol === "https:" ? new URL("./", location.href).href : "https://keepsake-bag.expo.app/");
const BUILD = "2026-11-09.ble3"; // bump on every release (the service worker cache name follows it in sw.js)
const tagUrl = (bag) => TagReader.linkFor(TAG_HOST, bag);
const IS_ANDROID = /Android/i.test(navigator.userAgent);
const IS_IOS = /iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
/* ---------- TagReader (tag-reader.js) ---------- */
// LinkTags: any phone; the tag's link opens this page. Nfc: Chrome on Android reads and writes in place.
const LinkTags = TagReader.LinkTagReader();
const Nfc = TagReader.WebNfcTagReader();
let nfcWroteAt = 0;
function onNfcTag(tag) {
  if (Date.now() - nfcWroteAt < 2500) return; // the tag we just wrote, still against the phone
  onTagTap(tag);
}
async function startNfc(fromPress = false) {
  if (!Nfc.canRead || Nfc.scanning) return Nfc.scanning;
  if (!fromPress && (await Nfc.permission()) !== "granted") return false; // the first time needs a button press
  const ok = await Nfc.start(onNfcTag, (msg) => toast(msg));
  if (!ok && fromPress && Nfc.lastError) toast(Nfc.lastError);
  if (S.data || S.view.name !== "home") render();
  return ok;
}
/** How to hold the phone, for this phone. */
const holdHow = () => IS_ANDROID
  ? (Nfc.scanning ? "Hold the back of your phone flat against the tag inside the bag." : "Hold the back of your phone to the tag inside the bag, then open the link it shows.")
  : "Hold the top edge of your iPhone to the tag inside the bag, then tap the banner that appears.";
const tagMatches = (tag, bag) => !!tag && !!bag && tag.bagId === bag.id && tag.key === bag.key;
function newBagKey() { return { id: b64url(crypto.getRandomValues(new Uint8Array(8))), key: b64url(crypto.getRandomValues(new Uint8Array(32))) }; }

async function savePending(p) {
  try { const db = await idb(); db.transaction(STORE, "readwrite").objectStore(STORE).put({ ...p, at: Date.now() }, "pending"); } catch {}
}
async function takePending() {
  try {
    const db = await idb();
    const p = await new Promise((res) => { const g = db.transaction(STORE).objectStore(STORE).get("pending"); g.onsuccess = () => res(g.result || null); g.onerror = () => res(null); });
    db.transaction(STORE, "readwrite").objectStore(STORE).delete("pending");
    return p && Date.now() - p.at < 10 * 60 * 1000 ? p : null; // a tap counts for what you started in the last 10 minutes
  } catch { return null; }
}
function clearPending() { idb().then((db) => db.transaction(STORE, "readwrite").objectStore(STORE).delete("pending")).catch(() => {}); }

/** What to do when Keepsake needs the bag: tap the phone to its NFC tag. A picture, not a button. */
function tagPrompt(label, small = false) {
  return `<div class="tag-prompt" role="status">
    <div class="deboss ${small ? "small" : ""} waiting" data-bag aria-hidden="true">${icons.nfc}</div>
    <b>${esc(label || "Tap your phone to the bag's tag")}</b>
    <p class="muted small">${holdHow()}${S.data?.tagSeenAt || S.claimBag ? "" : " The tag isn't set up yet: see Settings &amp; privacy."}</p>
    ${Nfc.canRead && !Nfc.scanning ? `<button class="btn" data-action="nfc-listen">Read the tag with this phone</button>` : ""}
    ${Nfc.scanning ? `<p class="small" style="margin:0">This phone is listening for the tag.</p>` : ""}
    <button class="link" data-action="sim-open">No tag with you? Use the virtual bag</button>
  </div>`;
}
function tapHint() {
  return `<p class="muted small" style="text-align:center">With the real bag: ${holdHow().replace(/^H/, "h")}${S.data?.tagSeenAt || S.claimBag ? "" : " First set up the tag in Settings &amp; privacy."} Testing? Tap the circle instead.</p>`;
}

/** Step-by-step for writing the bag's link with the NFC Tools app. */
function tagSetupBlock(bag) {
  const link = tagUrl(bag).replace(/^https:\/\//, "");

/** Wait until the phone knows where it is (a tag tap often lands before the first GPS fix). */
async function waitForFix(ms = 15000) {
  if (here()) return true;
  if (Loc.status === "off" || Loc.status === "denied") await Loc.start();
  const t0 = Date.now();
  while (!here() && Date.now() - t0 < ms && Loc.status !== "denied" && Loc.status !== "unavailable") await sleep(250);
  return !!here();
}

/** The memory waiting where the phone is now (sealed earlier and not just sealed here), if any. */
function arrivalHere() {
  if (!S.data) return null;
  return S.data.memories.filter((m) => m.armed !== false && placeCheck(m).inside && !S.opened.has(m.id))
    .sort((a, b) => placeCheck(a).dist - placeCheck(b).dist)[0] || null;
}
function nearestText() {
  const m = [...S.data.memories].sort((a, b) => placeCheck(a).dist - placeCheck(b).dist)[0];
  return m ? `The nearest is ${esc(m.place.name)}, ${fmtDist(placeCheck(m).dist)} away.` : "";
}
// One buzz per arrival: remembered across the page reload a tag tap causes, forgotten once you leave.

async function checkArrival() {
  if (!S.data || !Bag.isOpen) return;
  const last = announced.get();
  if (last) { const prev = S.data.memories.find((x) => x.id === last); if (!prev || placeCheck(prev).far) { announced.set(""); hideArrival(); } }
  const m = arrivalHere();
  if (!m || announced.get() === m.id || S.waitTap || S.preTapped) return; // a tag tap is already opening it
  announced.set(m.id);
  // The bag buzzes first (its motor, over Bluetooth, once paired; on screen otherwise). That's the cue to tap.
  await boop("arrival");
  showArrival(m);
  if (S.view.name === "home" || S.view.name === "memory") render();
}

  const el = $("#arrival");
  el.innerHTML = `<div class="ring" data-bag aria-hidden="true">${icons.nfc}</div>
    <div><b>${buzzWords()}</b><span class="small">${poss(m.author)} memory waits here, at ${esc(m.place.name)}. Tap your phone to the bag's tag to open it.${bagLinkNote()}</span></div>
    <div class="actions"><button class="link" data-action="arrival-later">Not now</button></div>`;

/** Open whatever memory waits where the phone is now. */
async function openHere() {
  if (!S.data.memories.length) return toast("No memories in this bag yet. Save the first one.");
  if (!here()) return toast("Keepsake doesn't know where you are yet. Check that location is on.");
  const ms = [...S.data.memories].sort((x, y) => placeCheck(x).dist - placeCheck(y).dist);
  const inside = ms.find((m) => placeCheck(m).inside && m.armed !== false);
  return openMemory(inside || ms[0], true);
}

/** Keepsake was opened by tapping a real tag. */
async function onTagTap(tag) {
  history.replaceState(null, "", location.pathname + location.search); // the key shouldn't sit in the address bar
  Timing.markTap(tag.via || "tag link", tag.tapAt ?? performance.now());
  if (realBagPaired()) RealBag.connect(); // start the radio now: a memory may open in a moment
  // Already open and waiting for a tap (iPhone reused this tab): that's the tap.
  if (S.waitTap && (tagMatches(tag, S.data?.bag) || tagMatches(tag, S.claimBag))) {
    const w = S.waitTap; S.waitTap = null; clearPending(); renderSim(); w.resolve(true);
    if (S.data) { S.data.tagSeenAt = Date.now(); persist(); }
    return;
  }
  const pend = await takePending();
  if (pend?.type === "claim" && tagMatches(tag, pend.bag)) {
    S.claimBag = pend.bag; S.ob = pend.ob || S.ob;
    S.view = { name: "claim", step: "name" }; Bag.el.hidden = true; Bag.isOpen = true; $("#shell").inert = false;
    render(); toast("That's your bag's tag. Now give the bag a name."); return;
  }
  if (!S.data) {
    // Someone new tapped a Keepsake tag: offer to make this the bag they're holding.
    S.ob.tag = tag; return;
  }
  if (!tagMatches(tag, S.data.bag)) { toast("This tag belongs to a different bag."); return; }
  S.data.tagSeenAt = Date.now(); persist();
  S.preTapped = { at: Date.now() };
  bagFace(); if (!Bag.isOpen) await Bag.open({ quick: true });
  if (pend?.type === "seal") {
    const d = pend.draft;
    if (d.media) d.mediaUrl = URL.createObjectURL(new Blob([d.media], { type: d.mime || "application/octet-stream" }));
    S.view = { name: "save", step: "seal", draft: d }; render();
    if (!d.spot) await waitForFix();
    return doSeal();
  }
  if (pend?.type === "pass") { S.view = { name: "pass", next: pend.next }; render(); return doPass(pend.next); }
  if (pend?.type === "open") {
    const m = S.data.memories.find((x) => x.id === pend.id);
    if (m) { S.view = { name: "memory", id: m.id }; render(); await waitForFix(); return openMemory(m, pend.viaHome); }
  }
  // A plain tap: open whatever waits here.
  S.view = { name: "home" }; render();
  toast("Your bag is here. Checking where you are…");
  if (!(await waitForFix())) { S.preTapped = null; return toast("Keepsake can't see where you are. Allow location for this site, then tap the bag again."); }
  return openHere();
}

/** Waits for the bag: a real tag tap (which may reload the page) or the virtual bag. */
function waitForTap(label, pending) {
  if (S.preTapped && Date.now() - S.preTapped.at < 120000) { S.preTapped = null; return Promise.resolve(true); }
  if (pending) savePending(pending);
  return new Promise((resolve) => { S.waitTap = { label, resolve }; renderSim(); render(); });
}
function tapBag() {
  Timing.markTap("virtual");
  // No flow waiting: a simulated tap behaves like tapping the real tag here.
  if (!S.waitTap) { if (S.data) { S.preTapped = { at: Date.now() }; closeSimOnPhone(); openHere(); } return; }
  const w = S.waitTap; S.waitTap = null;
  if (!S.sim.near) { toast("The phone isn't close enough to the bag (Virtual bag → Phone near the bag)."); S.waitTap = w; renderSim(); return; }
  renderSim(); clearPending(); w.resolve(true);

}
/** A test buzz from the Virtual bag panel or Settings: real bag when paired, virtual otherwise. */

}
function closeSimOnPhone() { if (matchMedia("(max-width: 899px)").matches) $("#sim").setAttribute("data-closed", ""); }
function cancelTap() { const w = S.waitTap; S.waitTap = null; clearPending(); renderSim(); w?.resolve(false); }
/* ---------- the bag's buzz: BagHaptics (bag-haptics.js) ---------- */
// Real: Web Bluetooth to the ESP32-S3, once a bag is paired. Simulated: the Virtual bag panel.
const RealBag = BagHaptics.BluetoothBagHaptics();

/** True once a real bag has been paired on this phone (connected or not). */

/** Re-render the Virtual bag panel, unless someone is typing in it. */
function renderSimQuietly() { const a = document.activeElement; if (a && $("#sim")?.contains(a) && a.matches("input, select")) return; renderSim(); }
RealBag.onChange(() => { renderSimQuietly(); const el = $("#bleStatus"); if (el) el.outerHTML = bleStatusBlock(); });

/** Only say the bag is buzzing when a real bag is paired; otherwise say what's true. */
function buzzWords() { return realBagPaired() ? "Your bag is buzzing." : "A memory waits here."; }
function bagLinkNote() {
  if (realBagPaired()) return "";
  return RealBag.supported
    ? ` <b style="font:inherit;display:inline">Your bag isn't paired, so it can't buzz.</b> Pair it in Settings &amp; privacy.`
    : ` <b style="font:inherit;display:inline">This browser can't reach your bag over Bluetooth</b>, so it can't buzz. ${IS_IOS ? "On iPhone, open Keepsake in the Bluefy browser." : "Open Keepsake in Chrome."}`;
}
/** What the bag's Bluetooth link is doing, in words, with the one button that helps. */
function bleStatusBlock(opts = {}) {
  const st = RealBag.state, name = esc(RealBag.deviceName || CONFIG.bag.name);
  let text, btn = "";
  if (st === "unsupported") text = "This browser can't use Bluetooth, so the bag's buzz shows on screen only. Bluetooth works in Chrome on Android, and on iPhone in the Bluefy browser.";
  else if (st === "unpaired") { text = `No bag paired on this phone yet. Buzzes show on screen only.`; btn = `<button class="btn" data-action="ble-pair">Find my bag</button>`; }
  else if (st === "connecting") text = `Connecting to ${name}…`;
  else if (st === "connected") text = `Connected to ${name}.${RealBag.lastConnectMs != null ? ` Took ${(RealBag.lastConnectMs / 1000).toFixed(1)} s.` : ""}`;

/* ---------- timing: tap-to-open and tap-to-buzz, kept on this phone only ---------- */
const Timing = {
  list: (() => { try { return JSON.parse(localStorage.getItem("keepsake.timing") || "[]"); } catch { return []; } })(),
  tapAt: null,      // performance.now() of the last tag tap (0 = this page was opened by the tap)
  tapVia: "",       // "tag link" | "web nfc" | "virtual"
  add(kind, ms, note = "") {
    this.list.unshift({ kind, ms: Math.round(ms), note, at: Date.now() });
    this.list.length = Math.min(this.list.length, 20);
    try { localStorage.setItem("keepsake.timing", JSON.stringify(this.list)); } catch {}
    renderSimQuietly();
  },
  clear() { this.list = []; try { localStorage.removeItem("keepsake.timing"); } catch {} renderSim(); },
  markTap(via, at = performance.now()) { this.tapAt = at; this.tapVia = via; },
  take() { const t = { at: this.tapAt, via: this.tapVia }; this.tapAt = null; return t; },
};

/** The moment's buzz (see CONFIG.buzz). `tap` is the tag tap that led here, for timing. */
function boop(event = "open", tap = null) { return sendBuzz(CONFIG.buzz[event] || "tap", tap); }
async function sendBuzz(cmd, tap = null) {
  phoneHaptic();
  if (realBagPaired()) {
    // Don't hold the screen for the radio: the memory shows while the command travels.
    RealBag.buzz(cmd).then((r) => {
      if (tap && tap.at != null) Timing.add("tap→buzz", performance.now() - tap.at, `${tap.via}, “${cmd}”${r.ok ? "" : ", failed"}`);
      Timing.add("bag write", r.ms, `“${cmd}”${r.ok ? "" : `: ${r.error}`}`);
      if (!r.ok) toast(`The bag didn't buzz: ${r.error}`);
    });
  } else {
    const r = await SimBag.buzz(cmd);
    if (!r.ok) { toast("The bag didn't buzz: its haptic module is off (Virtual bag panel)."); return; }
    if (tap && tap.at != null) Timing.add("tap→buzz", performance.now() - tap.at, `${tap.via}, virtual bag`);
  }
  if (realBagPaired()) await sleep(250);
  S.sim.lastBuzz = Date.now(); renderSim();
  for (const el of document.querySelectorAll("[data-bag]")) { el.classList.remove("buzz"); void el.offsetWidth; el.classList.add("buzz"); }
}

/* ---------- the closed bag: flap, clasp, going inside ---------- */
const EASE = "cubic-bezier(.32,.08,.24,1)";
/** An animation's end, but never later than its planned length: a hidden or throttled page must not stall a flow. */
function finished(a, opts = {}) {
  const ms = (opts.duration || 0) + (opts.delay || 0) + 150;
  return Promise.race([a.finished.catch(() => {}), sleep(ms)]);
}
const Bag = {
  get el() { return $("#bag"); },
  isOpen: false, waiter: null, anims: [],
  setFace(name, sub, hint) {
    $("#flapName").innerHTML = `${esc(name)}${sub ? `<span class="flap-sub">${esc(sub)}</span>` : ""}`;
    $("#bagHint").textContent = hint;
  },
  clear() { this.anims.forEach((a) => a.cancel()); this.anims = []; },
  play(el, frames, opts) { const a = el.animate(frames, { easing: EASE, fill: "both", ...opts }); this.anims.push(a); return finished(a, opts); },
  /** Resolves when someone presses the clasp. */
  waitForClasp() { $("#clasp").classList.add("ready"); $("#clasp").focus({ preventScroll: true }); return new Promise((r) => (this.waiter = r)); },
  pressClasp() { const w = this.waiter; this.waiter = null; $("#clasp").classList.remove("ready"); w ? w() : this.open(); },
  /** quick: a short fade instead of the flap, for tag taps, where every second counts. */
  async open({ quick = false } = {}) {
    if (this.isOpen) return;
    const bag = this.el, flap = $(".bag-flap"), body = $(".bag-body"), clasp = $("#clasp"), hint = $("#bagHint"), shell = $("#shell");
    phoneHaptic(20);
    if (reduceMotion() || quick) {
      await this.play(bag, [{ opacity: 1 }, { opacity: 0 }], { duration: 250 });
    } else {
      bag.style.background = "transparent";
      this.play(clasp, [{ transform: "scale(1)" }, { transform: "scale(.86)", offset: .35 }, { transform: "translateY(-10px) scale(1.02)", opacity: 0 }], { duration: 420 });
      this.play(hint, [{ opacity: .85 }, { opacity: 0 }], { duration: 250 });
      // The flap lifts slowly at first (leather is heavy), then swings up and away.
      this.play(flap, [{ transform: "rotateX(0deg)", opacity: 1 }, { transform: "rotateX(28deg)", opacity: 1, offset: .45 }, { transform: "rotateX(70deg)", opacity: 1, offset: .75 }, { transform: "rotateX(105deg)", opacity: 0 }], { duration: 1250, delay: 200, easing: "cubic-bezier(.4,0,.6,1)" });
      // Then we go in: the bag front opens around us and the lining comes up.
      this.play(body, [{ transform: "scale(1)", opacity: 1 }, { transform: "scale(1.5)", opacity: 0 }], { duration: 950, delay: 900 });
      await this.play(shell, [{ transform: "translateY(30px) scale(.92)", filter: "brightness(.65)", opacity: 0 }, { transform: "none", filter: "none", opacity: 1 }], { duration: 1000, delay: 980 });
    }
    bag.hidden = true; bag.style.background = ""; this.clear();
    shell.inert = false; this.isOpen = true;
    setTimeout(checkArrival, 400);
  },
  async close(hint = "") {
    const bag = this.el, flap = $(".bag-flap"), body = $(".bag-body"), clasp = $("#clasp"), hintEl = $("#bagHint"), shell = $("#shell");
    this.clear(); shell.inert = true; this.isOpen = false;
    hintEl.textContent = hint; clasp.classList.remove("ready");
    bag.hidden = false;
    if (reduceMotion()) { await this.play(bag, [{ opacity: 0 }, { opacity: 1 }], { duration: 250 }); this.clear(); return; }
    bag.style.background = "transparent";
    this.play(shell, [{ transform: "none", filter: "none" }, { transform: "translateY(18px) scale(.95)", filter: "brightness(.7)" }], { duration: 700 });
    this.play(body, [{ transform: "scale(1.45)", opacity: 0 }, { transform: "scale(1)", opacity: 1 }], { duration: 620 });
    this.play(clasp, [{ opacity: 0, transform: "translateY(-10px)" }, { opacity: 1, transform: "none" }], { duration: 300, delay: 820 });
    this.play(hintEl, [{ opacity: 0 }, { opacity: .85 }], { duration: 400, delay: 950 });
    await this.play(flap, [{ transform: "rotateX(118deg)", opacity: 0 }, { transform: "rotateX(0deg)", opacity: 1 }], { duration: 800, delay: 260, easing: "cubic-bezier(.5,0,.75,.2)" });
    bag.style.background = ""; this.clear();
  },
  /** The clasp snaps shut: the moment the bag boops. */
  async snap(event = "seal") {
    if (!reduceMotion()) await finished($("#clasp").animate([{ transform: "scale(1)" }, { transform: "scale(.84)" }, { transform: "scale(1.04)" }, { transform: "scale(1)" }], { duration: 360, easing: EASE }), { duration: 360 });
    await boop(event);
  },
  /** Hand the closed bag to someone else: it slides away and a "new" bag slides in. */
  async handOver() {
    if (reduceMotion()) return;
    await finished(this.el.animate([{ transform: "none" }, { transform: "translateX(-105%) rotate(-3deg)" }], { duration: 520, easing: "cubic-bezier(.6,0,.8,.3)" }), { duration: 520 });
    await finished(this.el.animate([{ transform: "translateX(105%) rotate(3deg)" }, { transform: "none" }], { duration: 620, easing: EASE }), { duration: 620 });
  },
};
function bagFace() {
  if (!S.data?.bag?.id) return Bag.setFace("Keepsake", "", "Press the clasp to begin");
  Bag.setFace(S.data.bag.name, `Carried by ${currentOwner().name}`, "Press the clasp to open");
}

/* ---------- example data (clearly marked) ---------- */
async function makeExample(myName = "You") {
  const key = b64url(crypto.getRandomValues(new Uint8Array(32)));
  const bag = { id: b64url(crypto.getRandomValues(new Uint8Array(8))), key, name: "Keepsake", claimedAt: Date.UTC(1998, 5, 2) };
  const owners = [
    { gen: 1, name: "Lena", since: Date.UTC(1998, 5, 2) },
    { gen: 2, name: myName, since: Date.now() },
  ];
  const ex = [
    { place: PLACES[1], at: Date.UTC(1998, 5, 14), author: "Lena", text:
      "Where are we? The top of the hill, by the statue.\nWho was here? Your grandfather and me, and a thermos of chai that went cold.\nWhat do you want them to know? We decided to stay in this city right here, on this bench. When the bells from downtown reach you, that's the sound we heard." },
    { place: PLACES[2], at: Date.UTC(2003, 9, 4), author: "Lena", text:
      "The bakery with the blue awning. Buy the anise cookies, eat one on the walk home, and don't tell anyone how many you had. I never did." },
    { place: PLACES[3], at: Date.UTC(2011, 3, 23), author: "Lena", text:
      "I taught your mother to ride a bike on this path. She fell twice and laughed both times. Be brave the way she was." },
  ];
  const memories = [];
  for (const e of ex) {
    const box = await seal(key, { kind: "note", text: e.text, author: e.author, at: e.at }, null);
    memories.push({ id: uid(), gen: 1, author: e.author, kind: "note", at: e.at, place: { name: e.place.name, lat: e.place.lat, lng: e.place.lng }, radius: 75, armed: true, box, responses: [] });
  }
  return { bag, owners, memories, isExample: true, onboarded: true };
}

/* ---------- rings (legacy motif) ---------- */
function ringsSVG() {
  const { owners, memories } = S.data;
  const G = owners.length, C = 160, core = 44;
  const step = Math.min(56, (146 - core) / Math.max(1, G - 1 + 0.4));
  const radiusFor = (g) => (g === 1 ? 0 : core + step * (g - 1));
  let s = `<svg class="rings" viewBox="0 0 320 320" role="img" aria-label="${G} generation${G > 1 ? "s" : ""} of memories, drawn as growth rings">`;
  // Center: first owner's chapter
  s += `<circle cx="${C}" cy="${C}" r="${core}" fill="var(--core)" opacity=".95"/>`;
  s += `<circle cx="${C}" cy="${C}" r="${core - 7}" fill="none" stroke="var(--line)" stroke-width="1.2" stroke-dasharray="3 4"/>`;
  for (let g = 2; g <= G; g++) {
    const r = radiusFor(g), isOuter = g === G;
    const cls = S.justPassed && isOuter ? ' class="ring-new"' : "";
    if (isOuter) {
      // Outer ring with an open gap: your chapter
      const gapDeg = 46, a0 = (-90 + gapDeg / 2) * Math.PI / 180, a1 = (270 - gapDeg / 2) * Math.PI / 180;
      const p = (a) => `${C + r * Math.cos(a)} ${C + r * Math.sin(a)}`;
      s += `<path${cls} d="M ${p(a0)} A ${r} ${r} 0 1 1 ${p(a1)}" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round"/>`;
      s += `<path d="M ${p(a1)} A ${r} ${r} 0 0 1 ${p(a0)}" fill="none" stroke="var(--accent)" stroke-width="1.4" stroke-dasharray="2 5" opacity=".7"/>`;
      s += `<text x="${C}" y="${C - r - 10}" text-anchor="middle" font-family="Instrument Serif, Georgia, serif" font-style="italic" font-size="15" fill="var(--accent)">your chapter</text>`;
    } else {
      s += `<circle${cls} cx="${C}" cy="${C}" r="${r}" fill="none" stroke="var(--line)" stroke-width="2"/>`;
    }
    s += `<circle cx="${C}" cy="${C}" r="${r - 5}" fill="none" stroke="var(--line)" stroke-width=".8" stroke-dasharray="2 4" opacity=".6"/>`;
  }
  if (G === 1) {
    s += `<text x="${C}" y="${C + core + 22}" text-anchor="middle" font-family="Instrument Serif, Georgia, serif" font-style="italic" font-size="15" fill="var(--accent)">your chapter begins here</text>`;
  }
  // Memory marks
  for (let g = 1; g <= G; g++) {
    const mems = memories.filter((m) => m.gen === g);
    const r = g === 1 ? core - 20 : radiusFor(g);
    const isOuter = g === G && G > 1;
    const span = isOuter ? 300 : 360, start = isOuter ? -90 + 30 : -90;
    mems.forEach((m, i) => {
      const a = (start + (span * (i + 0.5)) / Math.max(mems.length, isOuter ? 6 : 1)) * Math.PI / 180;
      const x = C + r * Math.cos(a), y = C + r * Math.sin(a);
      const open = S.opened.has(m.id), fresh = S.justSealed === m.id;
      s += `<g class="mark" data-mem="${m.id}" role="button" tabindex="0" aria-label="${esc(m.author)}'s ${m.kind} at ${esc(m.place.name)}, ${fmtDate(m.at)}${open ? ", open" : ", sealed"}">
        <circle cx="${x}" cy="${y}" r="16" fill="transparent"/>
        <circle${fresh ? ` class="grow${S.growLate ? " late" : ""}"` : ""} cx="${x}" cy="${y}" r="${open ? 8 : 6.5}" fill="${open ? "var(--accent)" : "var(--line)"}" stroke="var(--bg)" stroke-width="2"/>
      </g>`;
    });
  }
  return s + "</svg>";
}

/* ---------- views ---------- */
const icons = {
  photo: '<svg viewBox="0 0 48 48"><rect x="6" y="12" width="36" height="26" rx="4"/><circle cx="24" cy="25" r="7"/><path d="M17 12l3-5h8l3 5"/></svg>',

  note:  '<svg viewBox="0 0 48 48"><path d="M12 6h18l8 8v28H12z"/><path d="M30 6v8h8M18 24h14M18 30h14M18 36h9"/></svg>',
  rings: '<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="5"/><circle cx="24" cy="24" r="12"/><path d="M24 4a20 20 0 1 1-14.1 5.9" stroke-dasharray="3 3"/></svg>',
  nfc:   '<svg viewBox="0 0 48 48"><rect x="14" y="16" width="16" height="28" rx="3"/><path d="M19 20h6"/><path d="M33 9a10 10 0 0 1 0 12M37 5a16 16 0 0 1 0 20M29 12a5 5 0 0 1 0 6"/></svg>',
  bag:   '<svg viewBox="0 0 48 48"><path d="M8 18h32l-2 22H10z"/><path d="M8 18c0-6 7-10 16-10s16 4 16 10"/><circle cx="24" cy="25" r="3"/></svg>',
};
const kindWord = { photo: "photo", voice: "recording", note: "note" };

function topbar(back) {
  const b = S.data.bag;
  return `<div class="topbar">
    ${back ? `<button class="link" data-go="${back}">← Back</button>` : `<span class="eyebrow">${esc(b.name)}</span>`}
    ${S.data.isExample ? `<span class="pill">Example bag</span>` : `<span class="pill">Generation ${currentOwner().gen}</span>`}
  </div>`;
}

function viewClaim() {
  const step = S.view.step || "tap";
  if (step === "tap") return `
    <div class="stack" style="padding-top:24px">
      <span class="eyebrow">Keepsake</span>
      <h1>${S.waitTap ? "Now tap the tag." : "Give your bag its key."}</h1>
      <p class="muted">${S.waitTap ? "Hold the top of your iPhone to the tag you just wrote. When the banner appears, tap it." : "Inside the leather is a small tag. It will hold the key to every memory you keep in this bag. Nothing else can open them."}</p>
    </div>
    ${S.claimBag ? tagSetupBlock(S.claimBag) : ""}
    ${S.waitTap ? tagPrompt(S.waitTap.label) : `<button class="btn primary" data-action="claim-start">Make this bag's key</button>`}`;
  if (step === "name") return `
    <div class="stack" style="padding-top:24px">
      <span class="eyebrow">Your bag</span>
      <h2>What should we call it?</h2>
      <div><label for="bagName">Bag name</label><input id="bagName" type="text" value="My bag" autocomplete="off"></div>

    </div>
    <button class="btn primary" data-action="claim-name">Continue</button>`;
  if (step === "buzzer") return `
    <div class="stack" style="padding-top:24px">
      <span class="eyebrow">Your bag</span>
      <h2>Let the bag buzz.</h2>
      <p>Switch on the bag's haptic module and keep it close. Your phone looks for “${esc(CONFIG.bag.name)}” over Bluetooth and remembers it, so the bag can buzz when a memory opens.</p>
      <p class="muted small">Only the buzz goes over Bluetooth. The bag's key stays on its tag and on this phone.</p>
    </div>

    <button class="link" data-action="ble-pair-all" style="align-self:center">Bag not in the list? Show every nearby device</button>

  return `
    <div class="stack" style="padding-top:24px">
      <span class="eyebrow">How it works</span>
      <h2>Memories that wait for their place.</h2>
      <p>Save a photo, a recording or a few words where something happened. Seal it to the bag.</p>
      <p>Years from now, whoever carries this bag can come back to that place, tap it, and the memory opens. The bag gives a small buzz to say it's there.</p>

}

function viewHome() {
  const { owners, memories } = S.data;
  const me = currentOwner();
  let html = `<div class="topbar"><button class="link" data-action="close-bag">Close the bag</button>${S.data.isExample ? `<span class="pill">Example bag</span>` : `<span class="pill">Generation ${me.gen}</span>`}</div>${pretendNote()}`;
  html += `<div class="stack"><h1>${esc(S.data.bag.name)}</h1>
    <p class="muted">${sentence(`Carried by ${owners.map((o) => esc(o.name)).join(", then ")}`)} ${memories.length} memor${memories.length === 1 ? "y" : "ies"} sealed.</p></div>`;
  html += ringsSVG();
  const waiting = arrivalHere();
  html += waiting || S.waitTap
    ? tagPrompt(S.waitTap ? S.waitTap.label : `${poss(waiting.author)} memory waits here`, true)
    : `<div class="tag-prompt"><div class="deboss small" data-bag aria-hidden="true">${icons.nfc}</div>
        <p class="muted small">${here() ? `No memory waits here. ${nearestText()}` : "When you reach a memory's place, the bag buzzes. Then tap your phone to its tag."}</p></div>`;
  if (!S.data.tagSeenAt) html += `<section class="pocket stack" aria-label="Your bag's tag">
      <div class="chapter-head"><h3>Connect your bag's tag</h3><span class="muted small">NFC</span></div>
      <p class="small">Write this bag's link onto the NFC tag inside it, once. Then tapping the bag with your iPhone opens Keepsake, and opens the memory that waits where you're standing.</p>
      <button class="btn" data-action="tag-open">Set up the tag</button>
    </section>`;
  if (!realBagPaired()) html += `<section class="pocket stack" aria-label="Your bag's buzzer">
      <div class="chapter-head"><h3>Connect your bag's buzzer</h3><span class="muted small">Bluetooth</span></div>
      ${RealBag.supported
        ? `<p class="small">Switch on the bag, keep it close, and pair it once. Then it buzzes when you reach a memory and when one opens.</p>${bleStatusBlock()}`
        : `<p class="small">This browser can't use Bluetooth, so the bag can't buzz from here; buzzes only show on screen. ${IS_IOS ? "On iPhone, Safari and Chrome both lack Bluetooth: open this page in the free <b>Bluefy</b> browser instead." : "Open this page in <b>Chrome</b> instead."}</p>`}
    </section>`;
  html += `<button class="btn primary" data-go="save">Save a memory</button>`;
  if (memories.length) html += `<button class="btn" data-go="map">See where they wait</button>`;
  html += `<hr class="stitch"><div class="chapters">`;
  for (const o of [...owners].reverse()) {
    const mems = memories.filter((m) => m.gen === o.gen);
    const mine = o.gen === me.gen;
    html += `<section class="pocket" aria-label="${poss(o.name)} chapter${mine ? ", yours" : ""}"><div class="chapter-head"><h3>${poss(o.name)} chapter${mine ? '<span class="you-tag">you</span>' : ""}</h3><span class="muted small">Generation ${o.gen}</span></div>`;
    if (!mems.length) html += `<div class="gap-note">${o.gen === me.gen ? "Still open. Add your chapter." : "No memories yet."}</div>`;
    for (const m of mems) {
      const open = S.opened.has(m.id);
      html += `<button class="mem-btn" data-mem="${m.id}"><i class="dot ${open ? "open" : ""}"></i>
        <span><b>${esc(m.place.name)}</b><br><span class="muted small">${poss(m.author)} ${kindWord[m.kind]}${m.responses.length ? ` · ${m.responses.length} added` : ""}</span></span>
        <span class="meta">${fmtDate(m.at)}</span></button>`;
    }
    html += `</section>`;
  }
  html += `</div><hr class="stitch">
    <div class="row"><button class="btn" data-go="pass">Pass it down</button><button class="btn" data-go="privacy">Settings &amp; privacy</button></div>`;
  return html;
}

function viewSave() {
  const v = S.view, d = (v.draft ||= { kind: null, text: "", media: null, mime: "", mediaUrl: "", author: currentOwner().name, placeName: "" });
  const step = v.step || "kind";
  let h = topbar(step === "kind" ? "home" : null);
  if (step === "kind") {
    h += `<div class="stack"><span class="eyebrow">Save a memory</span><h2>What would you like to keep?</h2></div>
      <div class="stack">
        <button class="choice" data-kind="voice">${icons.voice}<span><b>Speak it</b><span class="muted small">Record your voice. No typing needed.</span></span></button>
        <button class="choice" data-kind="photo">${icons.photo}<span><b>A photo</b><span class="muted small">Take one now or choose one.</span></span></button>
        <button class="choice" data-kind="note">${icons.note}<span><b>Write it down</b><span class="muted small">A few words for whoever comes next.</span></span></button>
      </div>`;
  } else if (step === "capture") {
    h = `<div class="topbar"><button class="link" data-step="kind">← Back</button><span class="pill">${kindWord[d.kind]}</span></div>`;
    h += `<div class="prompts" aria-label="Prompts"><span>Where are we?</span><span>Who was here?</span><span>What do you want them to know?</span></div>`;
    if (d.kind === "voice") {
      const recording = !!rec.mr;
      h += `<input id="fileVoice" type="file" accept="audio/*" hidden>
        <button class="record ${recording ? "recording" : ""}" data-action="record" aria-pressed="${recording}">${recording ? `Tap to stop<br><span id="recTime" class="mono" style="font-size:16px">0:00</span>` : d.media ? "Record<br>again" : "Tap to<br>record"}</button>
        <p class="muted small" style="text-align:center">${recording ? "Take your time. Answer one question, or all three." : "Your own voice, just as it is."}</p>
        ${d.mediaUrl && !recording ? `<audio controls src="${d.mediaUrl}"></audio>` : ""}
        <button class="link" data-pick="fileVoice" style="align-self:center">Or choose a recording you already have</button>`;
    } else if (d.kind === "photo") {
      h += `<input id="filePhoto" type="file" accept="image/*" hidden>
        <button class="btn" data-pick="filePhoto">${d.media ? "Choose a different photo" : "Take or choose a photo"}</button>
        ${d.mediaUrl ? `<div class="preview"><img src="${d.mediaUrl}" alt="The photo you chose"></div>` : ""}
        <div><label for="caption">A few words (optional)</label><textarea id="caption" style="min-height:90px">${esc(d.text)}</textarea></div>`;
    } else {
      h += `<div><label for="noteText">Your note</label><textarea id="noteText" placeholder="Answer as much or as little as you like.">${esc(d.text)}</textarea></div>`;
    }
    h += `<div><label for="author">Who's adding this?</label><input id="author" type="text" value="${esc(d.author)}"></div>
      <button class="btn primary" data-action="capture-next">Next: the place</button>`;
  } else if (step === "place") {
    const p = here();
    if (!p) {
      const denied = Loc.status === "denied" || Loc.status === "unavailable";
      h += `<div class="stack"><span class="eyebrow">The place</span><h2>${denied ? "Keepsake can't see where you are." : "Finding where you are…"}</h2>
        <p class="muted">${denied ? "Turn on location for Keepsake in your phone's Settings, or pick a pretend place in the Virtual bag panel." : Loc.status === "off" ? "Keepsake needs your location to seal this memory to this spot." : "This takes a few seconds outdoors, a little longer inside."}</p></div>
        ${Loc.status === "off" ? `<button class="btn primary" data-action="allow-location">Use my location</button>` : ""}`;
      return h;
    }
    const key = `${p.lat.toFixed(4)},${p.lng.toFixed(4)}`;
    if (d.placeFor !== key && !d.placeTyped) { d.placeFor = key; suggestPlaceName(p, d); }
    h += `<div class="stack"><span class="eyebrow">The place</span><h2>This memory will wait here.</h2>
      <p class="coords">${fmtCoords(p)}${p.pretend ? " · pretend place" : p.acc ? ` · accurate to ${Math.round(p.acc)} m` : ""}</p>
      <div><label for="placeName">What is this place?</label><input id="placeName" type="text" value="${esc(d.placeName)}" placeholder="${d.naming ? "Finding its name…" : "Name this place"}" autocomplete="off"></div>
      <p>It will open within <b>${S.sim.radius} m</b> of this spot, and only after you've left and come back. That includes you.</p></div>
      <button class="btn primary" data-step="seal">Next: seal it</button>`;
  } else if (step === "seal") {
    h += `<div class="stack"><span class="eyebrow">Seal</span><h2>${S.waitTap ? "Now hold your phone to the bag." : "Press and hold to seal this memory."}</h2>
      <p class="muted">${S.waitTap ? "The key goes from the bag to this memory. After this, only the bag can open it, and only here." : `Sealed to the bag at ${esc(d.placeName)}.`}</p></div>`;
    h += S.waitTap
      ? tagPrompt(S.waitTap.label)
      : `<button class="btn primary hold" id="holdSeal" aria-describedby="holdHint"><i class="fill"></i><span>Seal this memory</span></button>
         <p id="holdHint" class="muted small" style="text-align:center">Keep pressing for about a second and a half.</p>`;
  }
  return h;
}

function viewMemory() {
  const m = S.data.memories.find((x) => x.id === S.view.id);
  if (!m) return viewHome();
  const o = S.opened.get(m.id);
  const c = placeCheck(m);
  let h = topbar(S.view.from || "home") + pretendNote();
  h += `<div class="stack"><span class="eyebrow">${esc(m.author)} · ${fmtDate(m.at)}</span><h2>${esc(m.place.name)}</h2></div>`;
  if (!o) {
    const status = m.armed === false
      ? (c.inside ? "Sealed here just now. It opens when you come back: leave this place, then return." : `Sealed. It opens when you're back at ${esc(m.place.name)}. You're ${fmtDist(c.dist)} away.`)
      : !c.known ? "Finding where you are…"
      : c.inside ? `You're here. ${buzzWords()} Tap your phone to its tag to open this.`
      : `This opens at ${esc(m.place.name)}. You're ${fmtDist(c.dist)} away.`;
    h += `<div class="memory-card"><div class="locked">
        <div class="lock-ring" data-bag>${icons[m.kind].replace("<svg", '<svg width="34" height="34" style="stroke:var(--primary);fill:none;stroke-width:1.6"')}</div>
        <h3>Sealed ${kindWord[m.kind]}</h3>
        <p class="muted">${status}</p>
      </div></div>`;
    if (S.waitTap) h += tagPrompt(S.waitTap.label);
    else if (c.inside && m.armed !== false) h += tagPrompt("Tap your phone to the bag's tag to open it");
    if (realBagPaired() && RealBag.state !== "connected") h += bleStatusBlock();
    if (S.view.notHere) h += `<div class="notice bad" role="alert">${S.view.notHere === "unarmed" ? "This memory was sealed here a moment ago. It stays closed until you've left and come back." : S.view.notHere === "unknown" ? "Keepsake doesn't know where you are yet. Check that location is on, then try again." : `Not here yet. This memory opens within ${m.radius} m of ${esc(m.place.name)}, and you're ${fmtDist(c.dist)} away.`}</div>`;
    return h;
  }
  h += `<div class="memory-card ${S.view.reveal ? "reveal" : ""}">${mediaBlock(o)}${o.meta.text ? `<div class="memory-text">${esc(o.meta.text)}</div>` : ""}</div>`;
  for (const r of m.responses) {
    const ro = S.opened.get(r.id);
    if (!ro) continue;
    h += `<div class="response"><span class="eyebrow">${esc(r.author)} added · ${fmtDate(r.at)}</span>${mediaBlock(ro)}${ro.meta.text ? `<div class="memory-text" style="font-size:22px">${esc(ro.meta.text)}</div>` : ""}</div>`;
  }
  if (S.view.respond) {
    const d = (S.view.rdraft ||= { text: "", author: "" });
    h += `<hr class="stitch"><div class="stack"><h3>Add to ${poss(m.author)} memory</h3>
      <p class="muted small">Answer them. What do you remember? What happened here since?</p>
      <div><label for="respAuthor">Your name</label><input id="respAuthor" type="text" value="${esc(d.author)}" placeholder="Who's adding this?"></div>
      <div><label for="respText">Your words</label><textarea id="respText">${esc(d.text)}</textarea></div>
      <button class="btn primary" data-action="respond-seal" data-id="${m.id}">Seal it with theirs</button>
      <button class="link" data-action="respond-cancel">Not now</button></div>`;
  } else {
    h += `<button class="btn primary" data-action="respond" data-id="${m.id}">Continue this memory</button>
      <p class="muted small" style="text-align:center">It closes again when you leave this page or walk away.</p>`;
  }
  return h;
}
function mediaBlock(o) {
  if (!o.mediaUrl) return "";
  if (o.meta.kind === "photo") return `<img src="${o.mediaUrl}" alt="Photo by ${esc(o.meta.author)}" style="width:100%;border-radius:12px;display:block">`;
  if (o.meta.kind === "voice") return `<audio controls src="${o.mediaUrl}"></audio>`;
  return "";
}

function viewPass() {

    return h + `<div class="stack"><span class="eyebrow">Generation ${me.gen}</span><h2>The bag is ${esc(me.name)}'s now.</h2>
      <p>Every memory that came before is still sealed in its place. ${esc(me.name)} can open them by going there and tapping the bag.</p>

      <button class="btn primary" data-go="save">Add your chapter</button>

  }
  h += `<div class="stack"><span class="eyebrow">Pass it down</span><h2>Who are you giving the bag to?</h2>
    <p class="muted">They'll be able to open every memory in it, at its place. You can't take this back once the bag is in their hands.</p>
